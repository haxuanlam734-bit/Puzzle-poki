<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle Light - 50 Levels</title>
    <style>
        body { margin: 0; padding: 0; background: radial-gradient(circle, #1a1a2e, #0f0f1a); display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: 'Arial', sans-serif; }
        canvas { box-shadow: 0 0 40px rgba(0, 243, 255, 0.2); border-radius: 12px; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
</head>
<body>

<script>
    let highestPuzzleLevel = parseInt(localStorage.getItem('puzzle_unlocked_50')) || 1;
    const MAX_LEVEL = 50;

    PokiSDK.init().then(() => { console.log("Poki SDK init"); }).catch(() => { console.log("Poki SDK failed"); });

    class BootScene extends Phaser.Scene {
        constructor() { super({ key: 'BootScene' }); }
        create() {
            let g = this.make.graphics({ x: 0, y: 0, add: false });
            // Ô đèn TẮT
            g.fillStyle(0x16213e); g.fillRoundedRect(0, 0, 60, 60, 10);
            g.generateTexture('tile_off', 60, 60); g.clear();
            // Ô đèn SÁNG
            g.fillStyle(0xfff200); g.fillRoundedRect(0, 0, 60, 60, 10);
            g.generateTexture('tile_on', 60, 60); g.clear();
            this.scene.start('LobbyScene');
        }
    }

    class LobbyScene extends Phaser.Scene {
        constructor() { super({ key: 'LobbyScene' }); }
        create() {
            this.add.text(400, 50, 'THẮP SÁNG TẤT CẢ', { fontSize: '40px', fill: '#00f3ff', fontStyle: 'bold' }).setOrigin(0.5);
            this.add.text(400, 95, 'PUZZLE - GIẢI ĐỐ', { fontSize: '20px', fill: '#ff00ff', letterSpacing: 5 }).setOrigin(0.5);

            let startX = 160, startY = 160;
            for (let i = 1; i <= MAX_LEVEL; i++) {
                let row = Math.floor((i - 1) / 10);
                let col = (i - 1) % 10;
                let x = startX + col * 52;
                let y = startY + row * 60;
                
                let isLocked = i > highestPuzzleLevel;
                let btn = this.add.rectangle(x, y, 45, 50, isLocked ? 0x2c3e50 : 0x00b4d8).setStrokeStyle(2, 0xffffff);
                
                if (!isLocked) {
                    btn.setInteractive({ useHandCursor: true })
                       .on('pointerdown', () => this.scene.start('GameScene', { level: i }));
                    this.add.text(x, y, i, { fontSize: '16px', fill: '#fff' }).setOrigin(0.5);
                } else {
                    this.add.text(x, y, '🔒', { fontSize: '14px' }).setOrigin(0.5);
                }
            }
        }
    }

    class GameScene extends Phaser.Scene {
        constructor() { super({ key: 'GameScene' }); }
        init(data) { this.level = data.level; this.isSolving = false; this.timeLeft = 180; }

        create() {
            PokiSDK.gameplayStart();
            this.add.text(400, 30, `MÀN: ${this.level}/50`, { fontSize: '24px', fill: '#fff' }).setOrigin(0.5);
            this.timerText = this.add.text(400, 60, '03:00', { fontSize: '20px', fill: '#ff4757' }).setOrigin(0.5);
            
            this.timeEvent = this.time.addEvent({ delay: 1000, callback: () => {
                this.timeLeft--;
                let m = Math.floor(this.timeLeft/60), s = this.timeLeft%60;
                this.timerText.setText(`${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`);
                if (this.timeLeft <= 0) this.timeOut();
            }, loop: true });

            // Cấu hình lưới
            this.gridSize = this.level <= 10 ? 3 : (this.level <= 25 ? 4 : 5);
            this.shuffleMoves = 2 + Math.floor(this.level * 0.8);
            this.createGrid();
            
            this.add.text(400, 560, '⏭ BỎ QUA', { fontSize: '20px', backgroundColor: '#8e44ad', padding: {x: 20, y: 10} })
                .setOrigin(0.5).setInteractive().on('pointerdown', () => this.nextLevel());
        }

        createGrid() {
            this.gridData = Array.from({length: this.gridSize}, () => Array(this.gridSize).fill(1));
            for(let i=0; i<this.shuffleMoves; i++) this.toggle(Phaser.Math.Between(0, this.gridSize-1), Phaser.Math.Between(0, this.gridSize-1));
            
            let startX = (800 - (this.gridSize * 70)) / 2 + 35;
            let startY = (600 - (this.gridSize * 70)) / 2;

            for(let r=0; r<this.gridSize; r++) {
                for(let c=0; c<this.gridSize; c++) {
                    let tile = this.add.sprite(startX + c*70, startY + r*70, this.gridData[r][c] ? 'tile_on' : 'tile_off').setInteractive();
                    tile.on('pointerdown', () => {
                        this.toggle(r, c);
                        this.updateBoard();
                        this.checkWin();
                    });
                    this.gridData[r][c].sprite = tile;
                }
            }
        }

        toggle(r, c) {
            const t = (row, col) => { if(row>=0 && row<this.gridSize && col>=0 && col<this.gridSize) this.gridData[row][col] = this.gridData[row][col] ? 0 : 1; };
            t(r,c); t(r-1,c); t(r+1,c); t(r,c-1); t(r,c+1);
        }

        updateBoard() {
            for(let r=0; r<this.gridSize; r++)
                for(let c=0; c<this.gridSize; c++)
                    this.gridData[r][c].sprite.setTexture(this.gridData[r][c] ? 'tile_on' : 'tile_off');
        }

        checkWin() {
            if (this.gridData.flat().every(val => val === 1)) this.nextLevel();
        }

        timeOut() {
            this.timeEvent.remove();
            PokiSDK.commercialBreak().then(() => this.scene.start('GameScene', { level: this.level }));
        }

        nextLevel() {
            if(this.isSolving) return;
            this.isSolving = true;
            if(this.level >= highestPuzzleLevel) localStorage.setItem('puzzle_unlocked_50', this.level + 1);
            PokiSDK.commercialBreak().then(() => this.level < MAX_LEVEL ? this.scene.start('GameScene', { level: this.level + 1 }) : this.scene.start('LobbyScene'));
        }
    }

    const config = { type: Phaser.AUTO, width: 800, height: 600, scene: [BootScene, LobbyScene, GameScene] };
    const game = new Phaser.Game(config);
</script>
</body>
</html>
