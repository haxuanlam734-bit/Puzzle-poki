<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stickman Hinokami Katana Legend</title>
    <!-- Poki SDK Official Script -->
    <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #030508;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            box-shadow: 0 0 50px rgba(255, 69, 0, 0.35);
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #ff4500;
        }
        canvas {
            background: linear-gradient(to bottom, #050508, #110914, #08040a);
            display: block;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            font-weight: 800;
            pointer-events: none;
            z-index: 10;
        }
        .hp-bar-container {
            width: 260px;
            height: 22px;
            background: rgba(255, 0, 0, 0.2);
            border: 2px solid #ff4757;
            border-radius: 11px;
            overflow: hidden;
            margin-top: 4px;
        }
        .hp-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff4757, #ff6b81);
            transition: width 0.15s ease;
        }
        .badge {
            background: rgba(15, 23, 42, 0.85);
            border: 1.5px solid #ff4500;
            color: #ffaa00;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 15px;
            box-shadow: 0 0 10px rgba(255, 69, 0, 0.4);
        }
        .stats-badge {
            color: #ffda79;
            font-size: 13px;
            margin-top: 4px;
        }
        #skillsHUD {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            pointer-events: none;
            z-index: 10;
        }
        .skill-box {
            width: 72px;
            height: 72px;
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid #ff4500;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            font-weight: bold;
            color: #fff;
            position: relative;
            backdrop-filter: blur(5px);
            text-align: center;
        }
        .skill-key {
            position: absolute;
            top: 4px;
            left: 6px;
            background: #ff4500;
            color: #fff;
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 900;
        }
        .cooldown-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.82);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 15px;
            color: #ffda79;
        }
        #adOverlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.2);
            border-top: 5px solid #ff4500;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas" width="1020" height="580"></canvas>

    <div id="ui">
        <div>
            HP HERO:
            <div class="hp-bar-container">
                <div id="playerHpBar" class="hp-bar"></div>
            </div>
            <div class="stats-badge">HP Tối Đa: <span id="maxHpStat">300</span> | Sát Thương: <span id="dmgStat">25</span> (+<span id="killBonusStat">0</span> từ diệt Zombie)</div>
        </div>
        <div class="badge">
            WAVE: <span id="levelNum" style="color:#fff;">1</span> | ZOMBIE: <span id="zombieCount">0</span>
        </div>
    </div>

    <div id="skillsHUD">
        <div class="skill-box">
            <span class="skill-key">L-CLICK</span>
            <span>Chém Hoả Thần</span>
        </div>
        <div class="skill-box">
            <span class="skill-key" style="background:#ff6b81;">E</span>
            <span>Lướt Nhanh (No CD)</span>
        </div>
        <div class="skill-box">
            <span class="skill-key">1</span>
            <span>Chém Liên Hoàn</span>
            <div id="cd1" class="cooldown-overlay" style="display:none;"></div>
        </div>
        <div class="skill-box">
            <span class="skill-key">2</span>
            <span>Chém Vô Hình</span>
            <div id="cd2" class="cooldown-overlay" style="display:none;"></div>
        </div>
        <div class="skill-box">
            <span class="skill-key">3</span>
            <span>Sóng Kiếm Lửa</span>
            <div id="cd3" class="cooldown-overlay" style="display:none;"></div>
        </div>
    </div>

    <div id="adOverlay">
        <div class="spinner"></div>
        <h2 style="color: #fff; font-size: 24px; margin-bottom: 10px;">ĐANG TẢI QUẢNG CÁO POKI...</h2>
        <p style="color: #aaa; font-size: 14px;">Chuẩn bị bước vào Wave tiếp theo!</p>
    </div>
</div>

<script>
// === POKI SDK ===
let pokiSdkReady = false;
PokiSDK.init().then(() => {
    pokiSdkReady = true;
    PokiSDK.gameLoadingFinished();
}).catch(() => {
    PokiSDK.gameLoadingFinished();
});

// === CANVAS SETUP ===
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const playerHpBar = document.getElementById('playerHpBar');
const levelNumEl = document.getElementById('levelNum');
const zombieCountEl = document.getElementById('zombieCount');
const maxHpStatEl = document.getElementById('maxHpStat');
const dmgStatEl = document.getElementById('dmgStat');
const killBonusStatEl = document.getElementById('killBonusStat');
const adOverlay = document.getElementById('adOverlay');

// === GAME ENGINE VARIABLES ===
const GROUND_Y = 470;
const GRAVITY = 0.65;

let currentLevel = 1;
let gameOver = false;
let levelCleared = false;
let isPausedForAd = false;
let animFrameCount = 0;
let totalZombiesKilled = 0; // Đếm tổng số zombie đã tiêu diệt

const keys = {};
const mouse = { x: 0, y: 0 };

// === PLAYER OBJECT ===
const player = {
    x: 150,
    y: GROUND_Y,
    vx: 0,
    vy: 0,
    speed: 9.5,
    maxHp: 300,
    hp: 300,
    baseDamage: 25,
    facing: 1,
    isGrounded: true,
    isAttacking: false,
    attackTimer: 0,
    
    // Cooldowns
    cooldowns: { skill1: 0, skill2: 0, skill3: 0 },

    // States
    isOmniSlashing: false,
    omniTimer: 0,
    
    // Skill 2
    isJudgmentCutActive: false,
    judgmentTimer: 0,
    vortexX: 0,
    vortexY: 0,

    get currentDamage() {
        // Cứ tiêu diệt 2 con zombie được +1 damage
        const bonusDamage = Math.floor(totalZombiesKilled / 2);
        return this.baseDamage + bonusDamage;
    },

    resetPosition() {
        this.x = 150;
        this.y = GROUND_Y;
        this.vx = 0;
        this.vy = 0;
        this.hp = this.maxHp;
        this.isGrounded = true;
        this.isAttacking = false;
        this.isOmniSlashing = false;
        this.isJudgmentCutActive = false;
        this.cooldowns = { skill1: 0, skill2: 0, skill3: 0 };
    },

    upgradeForNextLevel() {
        this.maxHp += 80;
        this.baseDamage += 3;
        this.hp = this.maxHp;
    }
};

// === ENTITY ARRAYS ===
let zombies = [];
let flameParticles = [];
let swordWaves = [];
let impactStars = [];
let flameSlashes = [];

// === ZOMBIE CLASS ===
class Zombie {
    constructor(x, wave) {
        this.x = x;
        this.y = GROUND_Y;
        this.vx = 0;
        this.vy = 0;
        
        this.maxHp = 120 + (wave - 1) * 110; 
        this.hp = this.maxHp;
        this.damage = 4 + wave * 0.8;
        this.speed = 1.6 + Math.random() * 1.0;
        
        this.isFloating = false;
        this.floatX = 0;
        this.floatY = 0;
        this.attackCooldown = 0;
        this.stunTimer = 0;
        this.animOffset = Math.random() * 100;
    }

    update() {
        if (this.stunTimer > 0) {
            this.stunTimer--;
            return;
        }

        if (this.isFloating) {
            this.x += (this.floatX - this.x) * 0.2;
            this.y += (this.floatY - this.y) * 0.2;
            return;
        }

        if (this.y < GROUND_Y) {
            this.vy += GRAVITY;
            this.y += this.vy;
            if (this.y >= GROUND_Y) {
                this.y = GROUND_Y;
                this.vy = 0;
            }
        }

        const dx = player.x - this.x;
        this.x += Math.sign(dx) * this.speed;

        if (Math.abs(dx) < 25 && Math.abs(player.y - this.y) < 30 && this.attackCooldown <= 0) {
            player.hp -= this.damage;
            this.attackCooldown = 60;
            addImpactStar(player.x, player.y - 20);
        }

        if (this.attackCooldown > 0) this.attackCooldown--;
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        const walkCycle = Math.sin((animFrameCount + this.animOffset) * 0.15);
        ctx.strokeStyle = '#2ed573';
        ctx.lineWidth = 3.5;
        ctx.lineCap = 'round';

        // Đầu Zombie
        ctx.beginPath();
        ctx.arc(0, -38, 9, 0, Math.PI * 2);
        ctx.stroke();

        // Mắt Đỏ
        ctx.fillStyle = '#ff4757';
        ctx.beginPath();
        ctx.arc(player.x > this.x ? 3 : -3, -40, 2.5, 0, Math.PI * 2);
        ctx.fill();

        // Thân
        ctx.beginPath();
        ctx.moveTo(0, -29);
        ctx.lineTo(0, -10);

        const armDir = player.x > this.x ? 1 : -1;
        ctx.moveTo(0, -22);
        ctx.lineTo(14 * armDir, -18 + walkCycle * 4);
        ctx.moveTo(0, -22);
        ctx.lineTo(12 * armDir, -10 - walkCycle * 4);

        ctx.moveTo(0, -10);
        ctx.lineTo(-8 + walkCycle * 6, 0);
        ctx.moveTo(0, -10);
        ctx.lineTo(8 - walkCycle * 6, 0);
        ctx.stroke();

        // Thanh máu
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(-18, -54, 36, 5);
        ctx.fillStyle = '#ff4757';
        ctx.fillRect(-18, -54, Math.max(0, (this.hp / this.maxHp) * 36), 5);

        ctx.restore();
    }
}

// === HIỆU ỨNG TIA LỬA HINOKAMI (GIỐNG ẢNH TANJIRO) ===
function createFlameFlakes(x, y, count) {
    for (let i = 0; i < count; i++) {
        flameParticles.push({
            x: x + (Math.random() - 0.5) * 40,
            y: y + (Math.random() - 0.5) * 40,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8 - 2,
            size: 3 + Math.random() * 5,
            life: 14 + Math.random() * 10,
            maxLife: 24,
            rotation: Math.random() * Math.PI * 2,
            vRot: (Math.random() - 0.5) * 0.3
        });
    }
}

function addFlameSlash(x, y, angle, radius = 80, scale = 1) {
    flameSlashes.push({
        x, y, angle, radius, scale,
        life: 12,
        maxLife: 12
    });
    createFlameFlakes(x, y, 8);
}

function addImpactStar(x, y) {
    impactStars.push({ x, y, life: 10, maxLife: 10 });
}

// === LEVEL SETUP ===
function setupLevel(lvl) {
    currentLevel = lvl;
    gameOver = false;
    levelCleared = false;
    zombies = [];
    flameParticles = [];
    swordWaves = [];
    impactStars = [];
    flameSlashes = [];

    const zombieCount = 8 + lvl * 4;

    for (let i = 0; i < zombieCount; i++) {
        const spawnX = Math.random() < 0.5 ? -60 - Math.random() * 500 : canvas.width + 60 + Math.random() * 500;
        zombies.push(new Zombie(spawnX, lvl));
    }

    player.resetPosition();

    if (typeof PokiSDK !== 'undefined' && PokiSDK.gameplayStart) {
        PokiSDK.gameplayStart();
    }
}

// === CONTROLS & LISTENERS ===
window.addEventListener('keydown', (e) => {
    keys[e.key.toLowerCase()] = true;

    if (gameOver || levelCleared || isPausedForAd) return;

    if ((e.key.toLowerCase() === 'w' || e.code === 'Space') && player.isGrounded) {
        player.vy = -14.5;
        player.isGrounded = false;
        createFlameFlakes(player.x, player.y, 6);
    }

    const now = Date.now();

    // CHIÊU E: LƯỚT NO CD + STUN 0.3S
    if (e.key.toLowerCase() === 'e') {
        createFlameFlakes(player.x, player.y - 20, 12);
        
        player.x = Math.max(30, Math.min(canvas.width - 30, mouse.x));
        player.y = Math.max(50, Math.min(GROUND_Y, mouse.y));
        player.vy = 0;

        addFlameSlash(player.x, player.y - 20, Math.PI / 4, 60, 0.8);
        addImpactStar(player.x, player.y - 20);

        zombies.forEach(z => {
            if (Math.hypot(z.x - player.x, z.y - player.y) < 100) {
                z.stunTimer = 18;
                createFlameFlakes(z.x, z.y - 20, 5);
            }
        });
    }

    // Skill 1: Chém Liên Hoàn
    if (e.key === '1' && now > player.cooldowns.skill1 && zombies.length > 0) {
        player.cooldowns.skill1 = now + 4500;
        player.isOmniSlashing = true;
        player.omniTimer = 26;
    }

    // Skill 2: Vô Hình Thiên Kiếm (Chém Lửa Hinokami)
    if (e.key === '2' && now > player.cooldowns.skill2 && zombies.length > 0) {
        player.cooldowns.skill2 = now + 8000;
        player.isJudgmentCutActive = true;
        player.judgmentTimer = 120;
        player.vortexX = mouse.x;
        player.vortexY = 180;
    }

    // Skill 3: Sóng Kiếm Lửa
    if (e.key === '3' && now > player.cooldowns.skill3) {
        player.cooldowns.skill3 = now + 3500;
        swordWaves.push({
            x: player.x,
            y: player.y - 20,
            dir: player.facing,
            speed: 18,
            radius: 55
        });
    }
});

window.addEventListener('keyup', (e) => {
    keys[e.key.toLowerCase()] = false;
});

canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
});

canvas.addEventListener('mousedown', (e) => {
    if (e.button === 0) {
        if (gameOver) {
            setupLevel(currentLevel);
            return;
        }
        if (levelCleared) {
            nextLevelWithAd();
            return;
        }

        if (!player.isAttacking) {
            player.isAttacking = true;
            player.attackTimer = 10;
            performNormalSlash();
        }
    }
});

// === ATTACK LOGIC ===
function performNormalSlash() {
    const attackRange = 100;
    player.facing = mouse.x > player.x ? 1 : -1;

    const angle = player.facing === 1 ? -Math.PI / 6 : Math.PI + Math.PI / 6;
    addFlameSlash(player.x + player.facing * 30, player.y - 25, angle, 90, 1.2);

    zombies.forEach(z => {
        if (Math.abs(z.x - player.x) < attackRange && Math.abs(z.y - player.y) < 60) {
            z.hp -= player.currentDamage;
            z.vx = player.facing * 4;
            addImpactStar(z.x, z.y - 20);
        }
    });
}

function nextLevelWithAd() {
    if (isPausedForAd) return;

    if (typeof PokiSDK !== 'undefined' && PokiSDK.gameplayStop) {
        PokiSDK.gameplayStop();
    }

    isPausedForAd = true;
    adOverlay.style.display = 'flex';

    const proceed = () => {
        adOverlay.style.display = 'none';
        isPausedForAd = false;
        player.upgradeForNextLevel();
        setupLevel(currentLevel + 1);
    };

    if (pokiSdkReady) {
        PokiSDK.commercialBreak().then(proceed).catch(proceed);
    } else {
        setTimeout(proceed, 1200);
    }
}

// === GAME UPDATE ===
function update() {
    if (gameOver || levelCleared || isPausedForAd) return;
    animFrameCount++;

    // 1. Movement
    if (keys['a'] || keys['arrowleft']) {
        player.x -= player.speed;
        player.facing = -1;
    }
    if (keys['d'] || keys['arrowright']) {
        player.x += player.speed;
        player.facing = 1;
    }
    player.x = Math.max(20, Math.min(canvas.width - 20, player.x));

    if (!player.isGrounded) {
        player.vy += GRAVITY;
        player.y += player.vy;
        if (player.y >= GROUND_Y) {
            player.y = GROUND_Y;
            player.vy = 0;
            player.isGrounded = true;
        }
    }

    // 2. Skill 1: Omni-Slash
    if (player.isOmniSlashing) {
        player.omniTimer--;
        if (zombies.length > 0 && player.omniTimer % 2 === 0) {
            const randomZombie = zombies[Math.floor(Math.random() * zombies.length)];
            player.x = randomZombie.x + (Math.random() - 0.5) * 30;
            player.y = randomZombie.y;
            randomZombie.hp -= player.currentDamage * 0.5;
            
            addFlameSlash(randomZombie.x, randomZombie.y - 20, Math.random() * Math.PI * 2, 70, 0.9);
            addImpactStar(randomZombie.x, randomZombie.y - 20);
        }
        if (player.omniTimer <= 0) {
            player.isOmniSlashing = false;
            player.y = GROUND_Y;
        }
    }

    // 3. Skill 2: Vô Hình Thiên Kiếm Lửa Hinokami
    if (player.isJudgmentCutActive) {
        player.judgmentTimer--;
        player.vx = 0;

        zombies.forEach(z => {
            z.isFloating = true;
            z.floatX = player.vortexX + (Math.random() - 0.5) * 80;
            z.floatY = player.vortexY + (Math.random() - 0.5) * 60;

            z.hp -= 0.85 + currentLevel * 0.15;
        });

        if (player.judgmentTimer % 2 === 0) {
            const cx = player.vortexX + (Math.random() - 0.5) * 110;
            const cy = player.vortexY + (Math.random() - 0.5) * 90;
            const angle = Math.random() * Math.PI * 2;
            addFlameSlash(cx, cy, angle, 85, 1.1);
        }

        if (player.judgmentTimer <= 0) {
            player.isJudgmentCutActive = false;
            zombies.forEach(z => {
                z.isFloating = false;
                z.vy = 4;
            });
        }
    }

    if (player.isAttacking) {
        player.attackTimer--;
        if (player.attackTimer <= 0) player.isAttacking = false;
    }

    // 4. Update Sóng Kiếm Lửa (Skill 3)
    for (let i = swordWaves.length - 1; i >= 0; i--) {
        let w = swordWaves[i];
        w.x += w.dir * w.speed;

        createFlameFlakes(w.x, w.y, 2);

        zombies.forEach(z => {
            if (Math.hypot(z.x - w.x, z.y - w.y) < w.radius + 15) {
                z.hp -= player.currentDamage * 1.1;
                addImpactStar(z.x, z.y - 20);
            }
        });

        if (w.x < -50 || w.x > canvas.width + 50) swordWaves.splice(i, 1);
    }

    // 5. Update Zombies & Tính năng: 2 Zombies tiêu diệt = +1 Sức mạnh
    for (let i = zombies.length - 1; i >= 0; i--) {
        let z = zombies[i];
        z.update();

        if (z.hp <= 0) {
            totalZombiesKilled++; // Tăng tổng số zombie diệt
            addImpactStar(z.x, z.y - 20);
            createFlameFlakes(z.x, z.y - 20, 15);
            zombies.splice(i, 1);
        }
    }

    // 6. Update Visual Particles
    for (let i = flameParticles.length - 1; i >= 0; i--) {
        let p = flameParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.rotation += p.vRot;
        p.life--;
        if (p.life <= 0) flameParticles.splice(i, 1);
    }

    for (let i = impactStars.length - 1; i >= 0; i--) {
        let s = impactStars[i];
        s.life--;
        if (s.life <= 0) impactStars.splice(i, 1);
    }

    for (let i = flameSlashes.length - 1; i >= 0; i--) {
        let fs = flameSlashes[i];
        fs.life--;
        if (fs.life <= 0) flameSlashes.splice(i, 1);
    }

    // State Checks
    if (player.hp <= 0) {
        player.hp = 0;
        gameOver = true;
        if (typeof PokiSDK !== 'undefined' && PokiSDK.gameplayStop) PokiSDK.gameplayStop();
    } else if (zombies.length === 0) {
        levelCleared = true;
        if (typeof PokiSDK !== 'undefined' && PokiSDK.gameplayStop) PokiSDK.gameplayStop();
    }

    // HUD Update
    playerHpBar.style.width = `${Math.max(0, (player.hp / player.maxHp) * 100)}%`;
    levelNumEl.innerText = currentLevel;
    zombieCountEl.innerText = zombies.length;
    maxHpStatEl.innerText = Math.round(player.maxHp);
    dmgStatEl.innerText = Math.round(player.currentDamage);
    killBonusStatEl.innerText = Math.floor(totalZombiesKilled / 2);

    updateCooldownHUD();
}

function updateCooldownHUD() {
    const now = Date.now();
    const cdMap = [
        { id: 'cd1', time: player.cooldowns.skill1 },
        { id: 'cd2', time: player.cooldowns.skill2 },
        { id: 'cd3', time: player.cooldowns.skill3 }
    ];

    cdMap.forEach(item => {
        const el = document.getElementById(item.id);
        if (now < item.time) {
            el.style.display = 'flex';
            el.innerText = ((item.time - now) / 1000).toFixed(1) + 's';
        } else {
            el.style.display = 'none';
        }
    });
}

// === HAM DRAW DUONG CHEM HOA THAN (HINOKAMI KAGURA SLAHSES) ===
function drawHinokamiSlashArc(ctx, radius, scale) {
    ctx.scale(scale, scale);

    // Lớp 1: Viền Đen Ngoại Cảnh (Black Contour Outlines)
    ctx.lineWidth = 18;
    ctx.strokeStyle = '#000000';
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(0, 0, radius, -Math.PI / 3, Math.PI / 3);
    ctx.stroke();

    // Lớp 2: Quầng Lửa Đỏ Rực (Inner Crimson Red Flame)
    ctx.lineWidth = 13;
    ctx.strokeStyle = '#d63031';
    ctx.beginPath();
    ctx.arc(0, 0, radius, -Math.PI / 3, Math.PI / 3);
    ctx.stroke();

    // Lớp 3: Bùng Lửa Cam Sáng (Orange Flame)
    ctx.lineWidth = 8;
    ctx.strokeStyle = '#ff7675';
    ctx.beginPath();
    ctx.arc(0, 0, radius, -Math.PI / 3, Math.PI / 3);
    ctx.stroke();

    // Lớp 4: Lõi Trắng Vàng Sáng Chói (Bright Core)
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#fff200';
    ctx.beginPath();
    ctx.arc(0, 0, radius, -Math.PI / 3, Math.PI / 3);
    ctx.stroke();
}

// === RENDERING ENGINE ===
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. Mặt đất
    ctx.fillStyle = '#0a0e1a';
    ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);
    ctx.strokeStyle = '#ff4500';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    ctx.lineTo(canvas.width, GROUND_Y);
    ctx.stroke();

    // 2. Sóng Kiếm Lửa (Skill 3)
    swordWaves.forEach(w => {
        ctx.save();
        ctx.translate(w.x, w.y);
        ctx.rotate(w.dir === 1 ? 0 : Math.PI);
        drawHinokamiSlashArc(ctx, w.radius, 1.2);
        ctx.restore();
    });

    // 3. Đường Chém Hoả Thần Hinokami (Hiệu ứng giống ảnh Tanjiro)
    flameSlashes.forEach(fs => {
        ctx.save();
        ctx.translate(fs.x, fs.y);
        ctx.rotate(fs.angle);
        drawHinokamiSlashArc(ctx, fs.radius, fs.scale);
        ctx.restore();
    });

    // 4. Vẽ Zombies
    zombies.forEach(z => z.draw());

    // 5. Cử Động Stickman Hero & Katana
    ctx.save();
    ctx.translate(player.x, player.y);

    const isMoving = keys['a'] || keys['d'] || keys['arrowleft'] || keys['arrowright'];
    const runCycle = isMoving ? Math.sin(animFrameCount * 0.25) : 0;

    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // Đầu
    ctx.beginPath();
    ctx.arc(0, -42, 9, 0, Math.PI * 2);
    ctx.stroke();

    // Thân
    ctx.beginPath();
    ctx.moveTo(0, -33);
    ctx.lineTo(0, -12);
    ctx.stroke();

    // Chân
    ctx.beginPath();
    if (!player.isGrounded) {
        ctx.moveTo(0, -12);
        ctx.lineTo(-10 * player.facing, -4);
        ctx.lineTo(-6 * player.facing, 8);

        ctx.moveTo(0, -12);
        ctx.lineTo(8 * player.facing, -2);
        ctx.lineTo(12 * player.facing, 10);
    } else {
        ctx.moveTo(0, -12);
        ctx.lineTo(-10 * player.facing + runCycle * 8, -2);
        ctx.lineTo(-12 * player.facing + runCycle * 8, 0);

        ctx.moveTo(0, -12);
        ctx.lineTo(10 * player.facing - runCycle * 8, -2);
        ctx.lineTo(12 * player.facing - runCycle * 8, 0);
    }
    ctx.stroke();

    // Tay & Katana Lửa
    ctx.beginPath();
    if (player.isAttacking) {
        ctx.moveTo(0, -26);
        ctx.lineTo(16 * player.facing, -22);
        ctx.stroke();

        ctx.strokeStyle = '#ff4500';
        ctx.lineWidth = 4.5;
        ctx.beginPath();
        ctx.moveTo(16 * player.facing, -22);
        ctx.lineTo(58 * player.facing, -10);
        ctx.stroke();
    } else {
        ctx.moveTo(0, -26);
        ctx.lineTo(12 * player.facing, -24);
        ctx.stroke();

        ctx.strokeStyle = '#ff4500';
        ctx.lineWidth = 4.5;
        ctx.beginPath();
        ctx.moveTo(12 * player.facing, -24);
        ctx.lineTo(54 * player.facing, -45);
        ctx.stroke();
    }

    ctx.restore();

    // 6. Ngôi sao va chạm (Hit Impact)
    impactStars.forEach(s => {
        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.fillStyle = '#fff200';
        ctx.strokeStyle = '#d63031';
        ctx.lineWidth = 2;

        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
            const angle = (i * Math.PI) / 4;
            const radius = i % 2 === 0 ? 18 : 7;
            ctx.lineTo(Math.cos(angle) * radius, Math.sin(angle) * radius);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
    });

    // 7. Tia/Mảnh Lửa Bay Lơ Lửng (Flame Embers & Spatters)
    flameParticles.forEach(p => {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);

        // Mảnh lửa hình lưỡi liềm/giọt bắn đặc trưng Hinokami
        ctx.fillStyle = p.life % 2 === 0 ? '#d63031' : '#ff7675';
        ctx.beginPath();
        ctx.arc(0, 0, p.size, 0, Math.PI * 1.5);
        ctx.fill();

        ctx.restore();
    });

    // OVERLAYS THẮNG / THUA
    if (gameOver) {
        ctx.fillStyle = 'rgba(3, 5, 8, 0.88)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ff4757';
        ctx.font = '800 46px Segoe UI';
        ctx.textAlign = 'center';
        ctx.fillText('BẠN ĐÃ TỬ TRẬN!', canvas.width / 2, canvas.height / 2 - 20);
        ctx.fillStyle = '#fff';
        ctx.font = '18px Segoe UI';
        ctx.fillText('Nhấp Chuột Trái để chơi lại', canvas.width / 2, canvas.height / 2 + 30);
    } else if (levelCleared) {
        ctx.fillStyle = 'rgba(3, 5, 8, 0.88)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ff4500';
        ctx.font = '800 44px Segoe UI';
        ctx.textAlign = 'center';
        ctx.fillText(`HOÀN THÀNH WAVE ${currentLevel}!`, canvas.width / 2, canvas.height / 2 - 30);
        ctx.fillStyle = '#ffda79';
        ctx.font = '20px Segoe UI';
        ctx.fillText(`🔥 Sát thương hiện tại: ${player.currentDamage} (+${Math.floor(totalZombiesKilled / 2)} từ diệt Zombie)`, canvas.width / 2, canvas.height / 2 + 10);
        ctx.fillStyle = '#fff';
        ctx.font = '16px Segoe UI';
        ctx.fillText('Nhấp Chuột Trái để sang Wave tiếp theo (Xem quảng cáo Poki)', canvas.width / 2, canvas.height / 2 + 55);
    }
}

// === MAIN LOOP ===
function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

setupLevel(currentLevel);
requestAnimationFrame(loop);
</script>
