<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stickman Spider Parkour - Poki Official Edition</title>
    <!-- Poki SDK Official Script -->
    <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #0d1117;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            box-shadow: 0 12px 40px rgba(0,0,0,0.85);
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #30363d;
        }
        canvas {
            background: linear-gradient(to bottom, #09131d, #162436, #1f334a);
            display: block;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 20px;
            font-weight: 800;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.9);
            pointer-events: none;
            z-index: 10;
        }
        .badge {
            background: rgba(235, 59, 90, 0.2);
            border: 1.5px solid #eb3b5a;
            color: #ff793f;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 16px;
        }
        #instructions {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 14px;
            pointer-events: none;
            text-align: center;
            backdrop-filter: blur(4px);
            z-index: 10;
        }
        #adOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.2);
            border-top: 5px solid #ff3838;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas" width="960" height="540"></canvas>

    <!-- HUD Overlay -->
    <div id="ui">
        <div>Màn: <span id="level" style="color:#2ed573;">1</span> / 10</div>
        <div class="badge">Khoảng cách tới đích: <span id="dist">500</span>m</div>
    </div>

    <div id="instructions">
        🖱️ <b>Giữ Chuột Trái</b>: Phóng tơ đu dây / Bám tường | ⌨️ <b>Space</b>: Nhảy bật đà
    </div>

    <!-- Commercial Break Screen -->
    <div id="adOverlay">
        <div class="spinner"></div>
        <h2 style="color: #fff; font-size: 24px; margin-bottom: 10px;">ĐANG TẢI QUẢNG CÁO POKI...</h2>
        <p style="color: #aaa; font-size: 14px;">Màn chơi tiếp theo sẽ bắt đầu sau giây lát</p>
    </div>
</div>

<script>
// === POKI SDK INTEGRATION ===
let pokiSdkReady = false;

PokiSDK.init().then(() => {
    pokiSdkReady = true;
    console.log("Poki SDK initialized successfully");
    PokiSDK.gameLoadingFinished();
}).catch(() => {
    console.log("Poki SDK failed or adblock enabled. Game will run in fallback mode.");
    PokiSDK.gameLoadingFinished();
});

// === GAME CONSTANTS & VARIABLES ===
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const levelEl = document.getElementById('level');
const distEl = document.getElementById('dist');
const adOverlay = document.getElementById('adOverlay');

const GRAVITY = 0.42;
const FRICTION = 0.985;
const WALL_SLIDE_FRICTION = 0.82;

let currentLevel = 1;
const MAX_LEVELS = 10;
let levelGoalX = 2500; // Target distance for Level 1
let cameraX = 0;
let gameOver = false;
let levelCleared = false;
let isPausedForAd = false;

// === STICKMAN PLAYER OBJECT ===
const player = {
    x: 100,
    y: 200,
    vx: 0,
    vy: 0,
    radius: 12,
    isGrounded: false,
    isTouchingWall: false,
    wallSide: 0, // -1: wall on left, 1: wall on right
    
    // Rope Physics
    web: {
        active: false,
        targetX: 0,
        targetY: 0,
        length: 0
    },

    reset(startX = 100, startY = 200) {
        this.x = startX;
        this.y = startY;
        this.vx = 4;
        this.vy = 0;
        this.web.active = false;
        this.isGrounded = false;
        this.isTouchingWall = false;
    }
};

// === LEVEL OBJECTS ===
let walls = [];
let bullets = [];
let cannons = [];

function setupLevel(lvl) {
    levelGoalX = 1800 + lvl * 700; // Length increases each level
    walls = [];
    bullets = [];
    cannons = [];
    cameraX = 0;
    gameOver = false;
    levelCleared = false;

    // Platform starting point
    walls.push({ x: 0, y: 380, width: 320, height: 160, isFinish: false });

    // Generate procedural obstacles & buildings
    let currX = 380;
    while (currX < levelGoalX) {
        const gap = 110 + Math.random() * 110;
        const width = 70 + Math.random() * 80;
        const height = 180 + Math.random() * 220;
        const y = canvas.height - height;

        walls.push({ x: currX, y, width, height, isFinish: false });

        // Add cannon to some buildings
        if (Math.random() < 0.45 + (lvl * 0.04)) {
            cannons.push({
                x: currX + width / 2,
                y: y - 10,
                lastShot: 0,
                cooldown: Math.max(1000, 2400 - lvl * 150)
            });
        }

        currX += width + gap;
    }

    // Finish Line Building
    walls.push({ x: levelGoalX, y: 260, width: 400, height: 280, isFinish: true });

    player.reset(100, 200);

    // Notify Poki
    if (typeof PokiSDK !== 'undefined' && PokiSDK.gameplayStart) {
        PokiSDK.gameplayStart();
    }
}

// === INPUT HANDLING ===
const mouse = { x: 0, y: 0, isDown: false };

window.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
});

canvas.addEventListener('mousedown', (e) => {
    if (e.button === 0) {
        mouse.isDown = true;
        if (gameOver) {
            setupLevel(currentLevel);
            return;
        }
        if (levelCleared) {
            nextLevelWithAd();
            return;
        }
        attachWeb();
    }
});

window.addEventListener('mouseup', (e) => {
    if (e.button === 0) {
        mouse.isDown = false;
        player.web.active = false;
    }
});

function attachWeb() {
    if (isPausedForAd) return;
    const targetWorldX = mouse.x + cameraX;
    const targetWorldY = mouse.y;

    // Check hit on walls
    let hit = false;
    for (let wall of walls) {
        if (targetWorldX >= wall.x && targetWorldX <= wall.x + wall.width &&
            targetWorldY >= wall.y && targetWorldY <= wall.y + wall.height) {
            hit = true;
            break;
        }
    }

    // Allow hooking to walls or high ceiling
    if (hit || targetWorldY < 180) {
        player.web.active = true;
        player.web.targetX = targetWorldX;
        player.web.targetY = targetWorldY;
        const dx = player.x - player.web.targetX;
        const dy = player.y - player.web.targetY;
        player.web.length = Math.max(40, Math.sqrt(dx * dx + dy * dy));
    }
}

window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
        if (isPausedForAd) return;

        if (player.web.active) {
            // Cut web with jump boost
            player.web.active = false;
            player.vy -= 7;
            player.vx += 4.5;
        } else if (player.isTouchingWall) {
            // Parkour Wall Jump
            player.vy = -10.5;
            player.vx += (player.wallSide === -1) ? -7 : 7;
        } else if (player.isGrounded) {
            // Normal Ground Jump
            player.vy = -11;
        }
    }
});

// === COMMERCIAL BREAK (ADS) SYSTEM ===
function nextLevelWithAd() {
    if (isPausedForAd) return;
    
    // Stop gameplay for Poki SDK
    if (typeof PokiSDK !== 'undefined' && PokiSDK.gameplayStop) {
        PokiSDK.gameplayStop();
    }

    isPausedForAd = true;
    adOverlay.style.display = 'flex';

    const proceedToNextLevel = () => {
        adOverlay.style.display = 'none';
        isPausedForAd = false;
        if (currentLevel < MAX_LEVELS) {
            currentLevel++;
        } else {
            currentLevel = 1; // Loop back or reset
        }
        setupLevel(currentLevel);
    };

    if (pokiSdkReady) {
        PokiSDK.commercialBreak(() => {
            // Audio mute / pause if needed
        }).then(() => {
            proceedToNextLevel();
        }).catch(() => {
            proceedToNextLevel();
        });
    } else {
        // Fallback simulation (1.5s delay)
        setTimeout(proceedToNextLevel, 1500);
    }
}

// === GAME ENGINE & PHYSICS ===
let lastTime = performance.now();

function update(now) {
    if (gameOver || levelCleared || isPausedForAd) return;

    // 1. Gravity & Drag
    player.vy += GRAVITY;
    player.vx *= FRICTION;
    player.vy *= FRICTION;

    // 2. Rope swinging physics
    if (player.web.active) {
        const dx = player.x - player.web.targetX;
        const dy = player.y - player.web.targetY;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist > player.web.length) {
            const angle = Math.atan2(dy, dx);
            player.x = player.web.targetX + Math.cos(angle) * player.web.length;
            player.y = player.web.targetY + Math.sin(angle) * player.web.length;

            // Swing velocity impulse
            const swingForce = 0.75;
            player.vx -= Math.cos(angle) * swingForce;
            player.vy -= Math.sin(angle) * swingForce;
        }
    }

    // Apply Velocity
    player.x += player.vx;
    player.y += player.vy;

    // 3. Wall Collisions & Parkour
    player.isGrounded = false;
    player.isTouchingWall = false;

    for (let wall of walls) {
        // Ground Collision
        if (player.x + player.radius > wall.x && player.x - player.radius < wall.x + wall.width) {
            if (player.y + player.radius >= wall.y && player.y - player.radius < wall.y + 25) {
                player.y = wall.y - player.radius;
                player.vy = 0;
                player.isGrounded = true;

                // Win Condition on Finish Building
                if (wall.isFinish) {
                    levelCleared = true;
                    if (typeof PokiSDK !== 'undefined' && PokiSDK.gameplayStop) {
                        PokiSDK.gameplayStop();
                    }
                }
            }
        }

        // Wall Slide Collision
        if (player.y + player.radius > wall.y && player.y - player.radius < wall.y + wall.height) {
            // Left edge
            if (Math.abs((player.x + player.radius) - wall.x) < 6) {
                player.x = wall.x - player.radius;
                player.vx = 0;
                player.vy *= WALL_SLIDE_FRICTION;
                player.isTouchingWall = true;
                player.wallSide = 1; // Bouncing left
            }
            // Right edge
            else if (Math.abs((player.x - player.radius) - (wall.x + wall.width)) < 6) {
                player.x = wall.x + wall.width + player.radius;
                player.vx = 0;
                player.vy *= WALL_SLIDE_FRICTION;
                player.isTouchingWall = true;
                player.wallSide = -1; // Bouncing right
            }
        }
    }

    // 4. Cannons Firing Bullets
    for (let c of cannons) {
        if (now - c.lastShot > c.cooldown && Math.abs(player.x - c.x) < 800) {
            c.lastShot = now;
            // Aim towards player
            const angle = Math.atan2(player.y - c.y, player.x - c.x);
            const speed = 5.5 + currentLevel * 0.3;
            bullets.push({
                x: c.x,
                y: c.y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                radius: 5
            });
        }
    }

    // 5. Bullets Update & Hitbox
    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;

        // Player bullet hit check
        const dist = Math.hypot(player.x - b.x, player.y - b.y);
        if (dist < player.radius + b.radius) {
            gameOver = true;
            if (typeof PokiSDK !== 'undefined' && PokiSDK.gameplayStop) {
                PokiSDK.gameplayStop();
            }
        }

        // Remove offscreen bullets
        if (b.x < cameraX - 100 || b.x > cameraX + canvas.width + 100) {
            bullets.splice(i, 1);
        }
    }

    // 6. Camera Follow
    cameraX = player.x - 180;

    // 7. Death in abyss
    if (player.y > canvas.height + 120) {
        gameOver = true;
        if (typeof PokiSDK !== 'undefined' && PokiSDK.gameplayStop) {
            PokiSDK.gameplayStop();
        }
    }

    // UI Updates
    levelEl.innerText = currentLevel;
    const remainingDist = Math.max(0, Math.floor((levelGoalX - player.x) / 10));
    distEl.innerText = remainingDist;
}

// === RENDERING ENGINE ===
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(-cameraX, 0);

    // 1. Draw Buildings / Walls
    for (let wall of walls) {
        if (wall.isFinish) {
            // Gold finish building
            ctx.fillStyle = '#f7b731';
            ctx.strokeStyle = '#fa8231';
        } else {
            // Cyberpunk Dark Metal
            ctx.fillStyle = '#1e272e';
            ctx.strokeStyle = '#00d2d3';
        }
        ctx.lineWidth = 3;
        ctx.fillRect(wall.x, wall.y, wall.width, wall.height);
        ctx.strokeRect(wall.x, wall.y, wall.width, wall.height);

        // Draw Finish Flag if finish building
        if (wall.isFinish) {
            ctx.fillStyle = '#2ed573';
            ctx.fillRect(wall.x + 30, wall.y - 60, 6, 60);
            ctx.beginPath();
            ctx.moveTo(wall.x + 36, wall.y - 60);
            ctx.lineTo(wall.x + 90, wall.y - 40);
            ctx.lineTo(wall.x + 36, wall.y - 20);
            ctx.fill();
        }
    }

    // 2. Draw Cannons
    ctx.fillStyle = '#eb3b5a';
    for (let c of cannons) {
        ctx.beginPath();
        ctx.arc(c.x, c.y, 10, 0, Math.PI * 2);
        ctx.fill();
    }

    // 3. Draw Web
    if (player.web.active) {
        ctx.beginPath();
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(player.web.targetX, player.web.targetY);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // Web hook point glow
        ctx.fillStyle = '#00d2d3';
        ctx.beginPath();
        ctx.arc(player.web.targetX, player.web.targetY, 5, 0, Math.PI * 2);
        ctx.fill();
    }

    // 4. Draw Stickman Spider-Man
    ctx.strokeStyle = '#ff3838'; // Spidey Red
    ctx.fillStyle = '#ff3838';
    ctx.lineWidth = 3.5;

    // Head
    ctx.beginPath();
    ctx.arc(player.x, player.y - 12, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Spidey Eyes
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(player.x + 3, player.y - 14, 2.5, 0, Math.PI * 2);
    ctx.fill();

    // Body
    ctx.strokeStyle = '#ff3838';
    ctx.beginPath();
    ctx.moveTo(player.x, player.y - 4);
    ctx.lineTo(player.x, player.y + 12);
    ctx.stroke();

    // Limbs Animation (Swinging vs Wall Sliding vs Normal)
    ctx.beginPath();
    if (player.web.active) {
        // Swing Pose
        ctx.moveTo(player.x, player.y - 2);
        ctx.lineTo(player.x - 10, player.y - 12);
        ctx.moveTo(player.x, player.y - 2);
        ctx.lineTo(player.x + 10, player.y + 6);

        ctx.moveTo(player.x, player.y + 12);
        ctx.lineTo(player.x - 10, player.y + 22);
        ctx.moveTo(player.x, player.y + 12);
        ctx.lineTo(player.x + 12, player.y + 16);
    } else if (player.isTouchingWall) {
        // Wall Parkour Pose
        ctx.moveTo(player.x, player.y - 2);
        ctx.lineTo(player.x + (player.wallSide * 10), player.y - 8);
        ctx.moveTo(player.x, player.y + 12);
        ctx.lineTo(player.x + (player.wallSide * 12), player.y + 20);
    } else {
        // Default / Running Pose
        ctx.moveTo(player.x, player.y - 2);
        ctx.lineTo(player.x - 8, player.y + 6);
        ctx.moveTo(player.x, player.y - 2);
        ctx.lineTo(player.x + 8, player.y + 6);

        ctx.moveTo(player.x, player.y + 12);
        ctx.lineTo(player.x - 6, player.y + 24);
        ctx.moveTo(player.x, player.y + 12);
        ctx.lineTo(player.x + 6, player.y + 24);
    }
    ctx.stroke();

    // 5. Draw Bullets
    ctx.fillStyle = '#ff9f1a';
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    for (let b of bullets) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
    }

    ctx.restore();

    // 6. OVERLAY SCREENS
    if (gameOver) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#eb3b5a';
        ctx.font = '800 42px Segoe UI';
        ctx.textAlign = 'center';
        ctx.fillText('BẠN ĐÃ THUA!', canvas.width / 2, canvas.height / 2 - 30);

        ctx.fillStyle = '#ffffff';
        ctx.font = '18px Segoe UI';
        ctx.fillText('Bị trúng đạn hoặc rơi xuống hố.', canvas.width / 2, canvas.height / 2 + 10);
        ctx.fillText('Nhấp Chuột Trái để chơi lại màn này', canvas.width / 2, canvas.height / 2 + 50);
    } else if (levelCleared) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#2ed573';
        ctx.font = '800 42px Segoe UI';
        ctx.textAlign = 'center';
        ctx.fillText(`HOÀN THÀNH MÀN ${currentLevel}!`, canvas.width / 2, canvas.height / 2 - 30);

        ctx.fillStyle = '#ffffff';
        ctx.font = '18px Segoe UI';
        ctx.fillText('Kỹ năng parkour & đu dây tuyệt vời!', canvas.width / 2, canvas.height / 2 + 10);
        ctx.fillText('Nhấp Chuột Trái để tiếp tục (Xem quảng cáo Poki)', canvas.width / 2, canvas.height / 2 + 50);
    }
}

// === MAIN GAME LOOP ===
function loop(now) {
    update(now);
    draw();
    requestAnimationFrame(loop);
}

// Start Game
setupLevel(currentLevel);
requestAnimationFrame(loop);
</script>
</body>
</html>
