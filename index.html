<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stickman Parkour</title>
    <style>
        body { margin: 0; padding: 0; background-color: #222; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { box-shadow: 0 0 20px rgba(0,0,0,0.8); border-radius: 10px; }
    </style>
    <!-- Thư viện Phaser 3 -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <!-- Poki SDK (Bản giả lập để test) -->
    <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
</head>
<body>

<script>
    // --- KHỞI TẠO POKI SDK ---
    PokiSDK.init().then(() => {
        console.log("Poki SDK initialized");
    }).catch(() => {
        console.log("Adblock enabled or Poki SDK failed");
    });

    // --- CẢNH SẢNH (LOBBY SCENE) ---
    class LobbyScene extends Phaser.Scene {
        constructor() {
            super({ key: 'LobbyScene' });
        }

        create() {
            // Trang trí sảnh
            this.cameras.main.setBackgroundColor('#2c3e50');
            this.add.text(400, 50, 'STICKMAN PARKOUR', { fontSize: '40px', fill: '#ecf0f1', fontStyle: 'bold' }).setOrigin(0.5);

            // Nút chọn chế độ
            const modes = ['Dễ', 'Khó', 'Siêu Khó'];
            const colors = ['#2ecc71', '#e67e22', '#e74c3c'];
            let currentMode = 'Dễ';

            const modeText = this.add.text(400, 120, 'Chế độ hiện tại: Dễ', { fontSize: '24px', fill: '#fff' }).setOrigin(0.5);

            modes.forEach((mode, index) => {
                let btn = this.add.rectangle(250 + (index * 150), 180, 120, 40, Phaser.Display.Color.HexStringToColor(colors[index]).color)
                    .setInteractive({ useHandCursor: true })
                    .on('pointerdown', () => {
                        currentMode = mode;
                        modeText.setText('Chế độ hiện tại: ' + mode);
                    });
                this.add.text(250 + (index * 150), 180, mode, { fontSize: '20px', fill: '#fff' }).setOrigin(0.5);
            });

            // Tạo lưới 50 Map
            this.add.text(400, 250, 'CHỌN MAP', { fontSize: '28px', fill: '#f1c40f' }).setOrigin(0.5);
            
            let startX = 130;
            let startY = 300;
            for (let i = 1; i <= 50; i++) {
                let row = Math.floor((i - 1) / 10);
                let col = (i - 1) % 10;
                let x = startX + col * 60;
                let y = startY + row * 60;

                // Nút chọn map
                let mapBtn = this.add.rectangle(x, y, 40, 40, 0x34495e)
                    .setInteractive({ useHandCursor: true })
                    .on('pointerdown', () => {
                        this.scene.start('GameScene', { level: i, mode: currentMode });
                    });
                this.add.text(x, y, i.toString(), { fontSize: '18px', fill: '#fff' }).setOrigin(0.5);
            }
        }
    }

    // --- CẢNH CHƠI GAME (GAME SCENE) ---
    class GameScene extends Phaser.Scene {
        constructor() {
            super({ key: 'GameScene' });
        }

        init(data) {
            this.level = data.level;
            this.mode = data.mode;
        }

        create() {
            this.cameras.main.setBackgroundColor('#87CEEB');
            this.add.text(20, 20, `Map: ${this.level} | Chế độ: ${this.mode}`, { fontSize: '20px', fill: '#000' });

            // Báo cho Poki biết game bắt đầu
            PokiSDK.gameplayStart();

            // Tạo mặt đất
            this.platforms = this.physics.add.staticGroup();
            let ground = this.platforms.create(400, 580, null).setSize(800, 40).setVisible(false);
            this.add.rectangle(400, 580, 800, 40, 0x27ae60);

            // Tạo bệ nhảy (Parkour)
            this.platforms.create(600, 450, null).setSize(100, 20).setVisible(false);
            this.add.rectangle(600, 450, 100, 20, 0x27ae60);

            // Tạo Stickman (khối vuông làm đại diện tạm thời)
            this.player = this.physics.add.sprite(100, 450, null).setSize(30, 50);
            this.add.rectangle(100, 450, 30, 50, 0x000000); // Vẽ stickman màu đen
            
            this.player.setBounce(0.1);
            this.player.setCollideWorldBounds(true);
            this.physics.add.collider(this.player, this.platforms);

            // Cửa qua màn
            this.goal = this.physics.add.sprite(750, 530, null).setSize(40, 60);
            this.add.rectangle(750, 530, 40, 60, 0xf1c40f);
            this.physics.add.collider(this.goal, this.platforms);
            
            // Xử lý khi chạm đích
            this.physics.add.overlap(this.player, this.goal, this.reachGoal, null, this);

            this.cursors = this.input.keyboard.createCursorKeys();
        }

        update() {
            // Di chuyển cơ bản
            if (this.cursors.left.isDown) {
                this.player.setVelocityX(-200);
            } else if (this.cursors.right.isDown) {
                this.player.setVelocityX(200);
            } else {
                this.player.setVelocityX(0);
            }

            // Nhảy
            if (this.cursors.up.isDown && this.player.body.touching.down) {
                this.player.setVelocityY(-400);
            }
        }

        reachGoal() {
            this.physics.pause();
            PokiSDK.gameplayStop(); // Báo Poki game tạm dừng

            // Hiện quảng cáo Poki khi qua màn
            PokiSDK.commercialBreak().then(() => {
                console.log("Quảng cáo kết thúc, quay về sảnh");
                this.scene.start('LobbyScene');
            });
        }
    }

    // --- CẤU HÌNH GAME ---
    const config = {
        type: Phaser.AUTO,
        width: 800,
        height: 600,
        physics: {
            default: 'arcade',
            arcade: {
                gravity: { y: 800 },
                debug: false
            }
        },
        scene: [LobbyScene, GameScene]
    };

    const game = new Phaser.Game(config);
</script>
</body>
</html>
