<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle Light - 50 Levels</title>
    <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
    <style>
        body {
            margin: 0; padding: 0;
            background: radial-gradient(circle, #1a1a2e, #0f0f1a);
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden; font-family: 'Arial', sans-serif;
            color: #fff; user-select: none;
        }
        #game-container {
            width: 800px; height: 600px;
            background: #100e26; border-radius: 16px;
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.2);
            border: 2px solid #00f3ff;
            display: flex; flex-direction: column; position: relative;
            overflow: hidden;
        }
        .screen {
            position: absolute; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            padding: 20px; box-sizing: border-box; transition: opacity 0.3s;
        }
        .hidden { display: none !important; }
        
        /* Lobby Style */
        h1 { color: #00f3ff; margin: 10px 0 5px 0; font-size: 32px; text-shadow: 0 0 10px rgba(0,243,255,0.5); }
        h2 { color: #ff00ff; margin: 0 0 20px 0; font-size: 18px; }
        .grid-lobby {
            display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px;
            width: 720px; max-height: 380px; overflow-y: auto; padding: 10px;
            background: rgba(0,0,0,0.3); border-radius: 8px;
        }
        .level-btn {
            background: #00b4d8; border: 2px solid #fff; border-radius: 6px;
            height: 45px; display: flex; align-items: center; justify-content: center;
            font-weight: bold; cursor: pointer; font-size: 14px; color: #fff;
        }
        .level-btn.locked { background: #2c3e50; border-color: #4b4b6b; color: #7f8c8d; cursor: not-allowed; }
        .level-btn:hover:not(.locked) { background: #00f3ff; transform: scale(1.05); }

        /* Game Screen Style */
        .header { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }
        .btn { background: #8e44ad; border: none; color: #fff; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn:hover { background: #9b59b6; }
        .puzzle-grid {
            display: grid; gap: 8px; margin: 30px auto;
        }
        .tile {
            width: 65px; height: 65px; border-radius: 10px; cursor: pointer;
            border: 2px solid #16213e; transition: transform 0.1s;
        }
        .tile.off { background: #16213e; }
        .tile.on { background: #fff200; box-shadow: 0 0 15px #fff200; border-color: #fff; }
        .tile:active { transform: scale(0.95); }
    </style>
</head>
<body>

<div id="game-container">
    <!-- SẢNH CHỜ (LOBBY) -->
    <div id="lobby-screen" class="screen">
        <h1>THẮP SÁNG TẤT CẢ</h1>
        <h2>PUZZLE - GIẢI ĐỐ</h2>
        <div class="grid-lobby" id="lobby-grid"></div>
        <button class="btn" style="background: #e74c3c; margin-top: 15px;" onclick="playSound('click'); resetProgress()">Xóa Tiến Trình Chơi Lại</button>
    </div>

    <!-- MÀN HÌNH CHƠI GAME -->
    <div id="game-screen" class="screen hidden">
        <div class="header">
            <button class="btn" style="background: #e67e22;" onclick="playSound('click'); backToLobby()">↩ Sảnh</button>
            <h2 id="level-title" style="margin:0; color:#00f3ff;">MÀN: 1/50</h2>
            <div id="timer" style="font-size: 20px; font-weight: bold; color: #ff4757;">05:00</div>
        </div>
        <div id="puzzle-board" class="puzzle-grid"></div>
        <button class="btn" onclick="playSound('click'); nextLevel()">⏭ BỎ QUA (ADS)</button>
    </div>
</div>

<script>
    // Khởi tạo âm thanh bằng Web Audio API an toàn, tự phát sinh tiếng kêu mà không cần file nhạc ngoài
    let audioCtx = null;
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    function playSound(type) {
        try {
            initAudio();
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            let now = audioCtx.currentTime;
            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, now);
                osc.frequency.exponentialRampToValueAtTime(200, now + 0.08);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'win') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.setValueAtTime(600, now + 0.1);
                osc.frequency.setValueAtTime(800, now + 0.2);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                osc.start(now);
                osc.stop(now + 0.35);
            }
        } catch(e) {}
    }

    // Khởi tạo Poki SDK an toàn
    try {
        if (typeof PokiSDK !== 'undefined') {
            PokiSDK.init().then(() => { console.log("Poki SDK init success"); }).catch(() => { console.log("Poki SDK failed"); });
        }
    } catch(e) {}

    const MAX_LEVEL = 50;
    let highestLevel = parseInt(localStorage.getItem('puzzle_unlocked_50')) || 1;
    let currentLevel = 1;
    let gridSize = 3;
    let gridData = [];
    let timeLeft = 300;
    let timerInterval = null;

    function initLobby() {
        const gridEl = document.getElementById('lobby-grid');
        gridEl.innerHTML = '';
        for (let i = 1; i <= MAX_LEVEL; i++) {
            let isLocked = i > highestLevel;
            let btn = document.createElement('div');
            btn.className = `level-btn ${isLocked ? 'locked' : ''}`;
            btn.innerHTML = isLocked ? '🔒' : i;
            if (!isLocked) {
                btn.onclick = () => {
                    playSound('click');
                    startLevel(i);
                };
            }
            gridEl.appendChild(btn);
        }
    }

    function resetProgress() {
        if(confirm("Bạn có chắc muốn chơi lại từ đầu?")) {
            localStorage.setItem('puzzle_unlocked_50', 1);
            highestLevel = 1;
            initLobby();
        }
    }

    function backToLobby() {
        clearInterval(timerInterval);
        try { if(typeof PokiSDK !== 'undefined') PokiSDK.gameplayStop(); } catch(e){}
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('lobby-screen').classList.remove('hidden');
        initLobby();
    }

    function startLevel(lvl) {
        currentLevel = lvl;
        timeLeft = 300;
        try { if(typeof PokiSDK !== 'undefined') PokiSDK.gameplayStart(); } catch(e){}

        document.getElementById('lobby-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('level-title').innerText = `MÀN: ${currentLevel}/50`;

        gridSize = currentLevel <= 15 ? 3 : (currentLevel <= 35 ? 4 : 5);
        
        createGridData();
        renderBoard();
        startTimer();
    }

    function createGridData() {
        gridData = Array.from({length: gridSize}, () => Array(gridSize).fill(1));
        let shuffleMoves = 2 + Math.floor(currentLevel * 0.7);
        for(let i = 0; i < shuffleMoves; i++) {
            let r = Math.floor(Math.random() * gridSize);
            let c = Math.floor(Math.random() * gridSize);
            toggleLogic(r, c);
        }
    }

    function toggleLogic(r, c) {
        const t = (row, col) => {
            if(row >= 0 && row < gridSize && col >= 0 && col < gridSize) {
                gridData[row][col] = gridData[row][col] === 1 ? 0 : 1;
            }
        };
        t(r, c); t(r-1, c); t(r+1, c); t(r, c-1); t(r, c+1);
    }

    function renderBoard() {
        const board = document.getElementById('puzzle-board');
        board.style.gridTemplateColumns = `repeat(${gridSize}, 65px)`;
        board.innerHTML = '';

        for(let r = 0; r < gridSize; r++) {
            for(let c = 0; c < gridSize; c++) {
                let tile = document.createElement('div');
                tile.className = `tile ${gridData[r][c] === 1 ? 'on' : 'off'}`;
                tile.onclick = () => {
                    playSound('click');
                    toggleLogic(r, c);
                    renderBoard();
                    checkWin();
                };
                board.appendChild(tile);
            }
        }
    }

    function checkWin() {
        let isWin = gridData.every(row => row.every(val => val === 1));
        if(isWin) {
            clearInterval(timerInterval);
            playSound('win');
            alert("🌟 CHIẾN THẮNG! Chúc mừng bạn qua màn " + currentLevel);
            nextLevel();
        }
    }

    function startTimer() {
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            let m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            let s = (timeLeft % 60).toString().padStart(2, '0');
            document.getElementById('timer').innerText = `${m}:${s}`;
            if(timeLeft <= 0) {
                clearInterval(timerInterval);
                alert("Hết giờ!");
                try {
                    if(typeof PokiSDK !== 'undefined') {
                        PokiSDK.commercialBreak().then(() => startLevel(currentLevel)).catch(() => startLevel(currentLevel));
                    } else { startLevel(currentLevel); }
                } catch(e) { startLevel(currentLevel); }
            }
        }, 1000);
    }

    function nextLevel() {
        clearInterval(timerInterval);
        try { if(typeof PokiSDK !== 'undefined') PokiSDK.gameplayStop(); } catch(e){}

        if(currentLevel >= highestLevel && currentLevel < MAX_LEVEL) {
            highestLevel = currentLevel + 1;
            localStorage.setItem('puzzle_unlocked_50', highestLevel);
        }

        let proceed = () => {
            if(currentLevel < MAX_LEVEL) {
                startLevel(currentLevel + 1);
            } else {
                backToLobby();
            }
        };

        try {
            if(typeof PokiSDK !== 'undefined') {
                PokiSDK.commercialBreak().then(proceed).catch(proceed);
            } else { proceed(); }
        } catch(e) { proceed(); }
    }

    initLobby();
</script>
</body>
</html>
