<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stickman Parkour - Hardcore</title>
    <style>
        body { margin: 0; padding: 0; background-color: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden;}
        canvas { box-shadow: 0 0 30px rgba(230, 126, 34, 0.4); border-radius: 10px; border: 2px solid #e67e22; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
</head>
<body>

<script>
    // --- LƯU TRỮ TIẾN TRÌNH ---
    let highestLevel = parseInt(localStorage.getItem('stickman_unlocked_hc')) || 1;

    PokiSDK.init().then(() => { console.log("Poki SDK init"); }).catch(() => { console.log("Poki SDK failed"); });

    // --- SCENE TẠO HÌNH ẢNH ---
    class BootScene extends Phaser.Scene {
        constructor() { super({ key: 'BootScene' }); }
        create() {
            let g = this.make.graphics({ x: 0, y: 0, add: false });
            
            // Người Que
            g.lineStyle(2, 0xffffff);
            g.beginPath();
            g.strokeCircle(16, 8, 6); 
            g.moveTo(16, 14); g.lineTo(16, 30); 
            g.moveTo(16, 18); g.lineTo(6, 26); 
            g.moveTo(16, 18); g.lineTo(26, 26); 
            g.moveTo(16, 30); g.lineTo(8, 44); 
            g.moveTo(16, 30); g.lineTo(24, 44); 
            g.strokePath();
            g.generateTexture('stickman', 32, 48); g.clear();

            // Cửa Đích
            g.fillStyle(0x2ecc71); g.fillRect(0, 0, 40, 60); 
            g.fillStyle(0x000000); g.fillRect(5, 5, 30, 50); 
            g.generateTexture('portal', 40, 60); g.clear();

            // Gai nhọn
            g.fillStyle(0xe74c3c); g.beginPath();
            g.moveTo(0, 32); g.lineTo(16, 0); g.lineTo(32, 32); g.closePath(); g.fillPath();
            g.generateTexture('spike', 32, 32); g.clear();

            // Bệ đá
            g.fillStyle(0x2c3e50); g.fillRect(0, 0, 32, 32);
            g.lineStyle(2, 0x34495e); g.strokeRect(0, 0, 32, 32);
            g.generateTexture('block', 32, 32); g.clear();

            this.scene.start('LobbyScene');
        }
    }

    // --- SẢNH CHỜ ---
    class LobbyScene extends Phaser.Scene {
        constructor() { super({ key: 'LobbyScene' }); }
        create() {
            this.cameras.main.setBackgroundColor('#1a1a1a');
            
            this.add.text(400, 60, 'STICKMAN PARKOUR', { fontSize: '48px', fill: '#fff', fontStyle: 'bold' }).setOrigin(0.5);
            this.add.text(400, 110, 'CHẾ ĐỘ: HARDCORE (KHÔNG TROLL)', { fontSize: '24px', fill: '#e67e22', fontStyle: 'bold' }).setOrigin(0.5);

            this.add.text(400, 550, '[ Xóa Dữ Liệu Chơi Lại ]', { fontSize: '16px', fill: '#95a5a6' })
                .setOrigin(0.5).setInteractive({ useHandCursor: true })
                .on('pointerdown', () => {
                    localStorage.setItem('stickman_unlocked_hc', 1);
                    highestLevel = 1;
                    this.scene.restart();
                });

            let startX = 130, startY = 200;
            for (let i = 1; i <= 50; i++) {
                let row = Math.floor((i - 1) / 10), col = (i - 1) % 10;
                let x = startX + col * 60, y = startY + row * 60;
                
                let isLocked = i > highestLevel; 
                let color = isLocked ? 0x333333 : 0xe67e22; // Đổi màu sảnh thành cam cho ngầu
                let textColor = isLocked ? '#555' : '#fff';

                let btn = this.add.rectangle(x, y, 45, 45, color);
                
                if (!isLocked) {
                    btn.setInteractive({ useHandCursor: true })
                       .on('pointerdown', () => this.scene.start('GameScene', { level: i }))
                       .on('pointerover', () => btn.setFillStyle(0xd35400))
                       .on('pointerout', () => btn.setFillStyle(0xe67e22));
                    this.add.text(x, y, i.toString(), { fontSize: '20px', fill: textColor, fontStyle: 'bold' }).setOrigin(0.5);
                } else {
                    this.add.text(x, y, 'X', { fontSize: '20px', fill: textColor, fontStyle: 'bold' }).setOrigin(0.5);
                }
            }
        }
    }

    // --- CẢNH CHƠI GAME ---
    class GameScene extends Phaser.Scene {
        constructor() { super({ key: 'GameScene' }); }
        init(data) { this.level = data.level; }

        create() {
            this.cameras.main.setBackgroundColor('#2c3e50');
            
            this.add.text(20, 20, `MAP: ${this.level}`, { fontSize: '20px', fill: '#fff', fontStyle: 'bold' });
            
            this.add.text(700, 20, 'Về Sảnh ↩', { fontSize: '18px', fill: '#e74c3c' })
                .setInteractive({ useHandCursor: true })
                .on('pointerdown', () => {
                    this.physics.pause();
                    this.scene.start('LobbyScene');
                });

            PokiSDK.gameplayStart();

            this.platforms = this.physics.add.staticGroup();
            this.spikes = this.physics.add.group({ allowGravity: false, immovable: true });
            this.fallingBlocks = this.physics.add.group({ allowGravity: false, immovable: true });

            // Người que (Hitbox siêu chuẩn để parkour)
            this.player = this.physics.add.sprite(50, 400, 'stickman').setSize(14, 42); 
            this.player.setCollideWorldBounds(true);
            
            this.physics.add.collider(this.player, this.platforms);
            this.physics.add.overlap(this.player, this.spikes, this.die, null, this);
            
            // Cơ chế bệ sập (Rơi rất nhanh sau khi chạm 0.1s)
            this.physics.add.collider(this.player, this.fallingBlocks, (player, block) => {
                if (player.body.touching.down && block.body.touching.up) {
                    this.time.delayedCall(100, () => { block.body.allowGravity = true; }, [], this);
                }
            });

            this.cursors = this.input.keyboard.createCursorKeys();
            this.buildLevel(this.level);
        }

        buildLevel(level) {
            const createGround = (x, y, width, height = 32) => {
                let p = this.add.tileSprite(x + width/2, y + height/2, width, height, 'block');
                this.physics.add.existing(p, true);
                this.platforms.add(p);
            };

            const createGoal = (x, y) => {
                this.goal = this.physics.add.sprite(x, y, 'portal');
                this.goal.body.allowGravity = false;
                this.physics.add.overlap(this.player, this.goal, this.win, null, this);
            };

            // Rải gai toàn bộ đáy vực cho mọi map
            const fillSpikes = () => {
                for(let i=0; i<25; i++) { this.spikes.create(16 + i*32, 584, 'spike'); }
            };

            if (level === 1) {
                // Kỹ năng: Nhảy chuẩn xác lên các bệ cực nhỏ
                createGround(0, 500, 100); // Bắt đầu
                
                createGround(200, 450, 32); // Bệ nhỏ 1
                createGround(350, 400, 32); // Bệ nhỏ 2
                createGround(550, 350, 32); // Bệ nhỏ 3

                createGround(700, 300, 100); // Đích
                createGoal(750, 270);
                fillSpikes();
            } 
            else if (level === 2) {
                // Kỹ năng: Kiểm soát lực nhảy (Nhảy khe hẹp)
                createGround(0, 500, 100);
                
                // Nhảy xa nhưng có trần nhà chặn trên đầu
                createGround(200, 500, 64);
                createGround(200, 300, 200, 100); // Trần nhà chặn
                
                createGround(400, 500, 64);
                createGround(400, 350, 200, 100); // Trần nhà chặn tiếp theo

                createGround(600, 500, 64);

                createGround(750, 400, 50);
                createGoal(750, 370);
                fillSpikes();
            }
            else if (level === 3) {
                // Kỹ năng: Tốc độ và phản xạ (Cầu sập)
                createGround(0, 500, 50);
                
                // Chuỗi bệ sập cách xa nhau
                for(let i=0; i<6; i++) {
                    let fBlock = this.add.tileSprite(150 + i*90, 500 - i*20, 32, 32, 'block');
                    this.physics.add.existing(fBlock);
                    this.fallingBlocks.add(fBlock);
                }

                createGround(700, 380, 100);
                createGoal(750, 350);
                fillSpikes();
            }
            else if (level === 4) {
                // Kỹ năng: Thả rơi tự do và hãm phanh
                createGround(0, 150, 100);
                
                // Bức tường khổng lồ chặn ngang, phải lách qua khe hẹp bên dưới
                createGround(200, 0, 32, 400); 
                createGround(200, 500, 32, 100); 

                // Tường thứ 2
                createGround(400, 200, 32, 400);
                createGround(400, 0, 32, 100);

                // Tường thứ 3
                createGround(600, 0, 32, 450);

                createGround(700, 500, 100);
                createGoal(750, 470);
                fillSpikes();
            }
            else if (level === 5) {
                // Kỹ năng: Tổng hợp - Ma trận Hardcore
                createGround(0, 500, 50);
                
                // Trần thấp
                createGround(120, 350, 100, 32); 
                createGround(150, 500, 32); // Bệ hẹp dưới trần thấp
                
                // Bệ sập giữa không trung
                let b1 = this.add.tileSprite(300, 450, 32, 32, 'block');
                this.physics.add.existing(b1); this.fallingBlocks.add(b1);

                let b2 = this.add.tileSprite(420, 350, 32, 32, 'block');
                this.physics.add.existing(b2); this.fallingBlocks.add(b2);

                // Bức tường cản cuối cùng
                createGround(550, 200, 32, 400);
                let b3 = this.add.tileSprite(550, 100, 32, 32, 'block'); // Chỗ đứng sập trên đỉnh tường
                this.physics.add.existing(b3); this.fallingBlocks.add(b3);

                createGround(700, 150, 100);
                createGoal(750, 120);
                fillSpikes();
            } else {
                createGround(0, 500, 800);
                this.add.text(400, 300, 'CHÚC MỪNG BẠN ĐÃ PHÁ ĐẢO', { fontSize: '24px', fill: '#2ecc71', fontStyle: 'bold' }).setOrigin(0.5);
                createGoal(750, 470);
            }
        }

        update() {
            let speed = 220; // Giảm tốc độ chạy một chút để dễ kiểm soát chính xác hơn
            let jumpForce = -580; // Nhảy rất bốc

            // Cải thiện cảm giác điều khiển trên không (Air Control)
            if (this.cursors.left.isDown) {
                this.player.setVelocityX(-speed);
            } else if (this.cursors.right.isDown) {
                this.player.setVelocityX(speed);
            } else {
                // Hãm phanh tức thì khi thả phím (Rất quan trọng trong Parkour khó)
                this.player.setVelocityX(0);
            }

            // Nhảy
            if (this.cursors.up.isDown && this.player.body.touching.down) {
                this.player.setVelocityY(jumpForce);
            }

            if (this.player.y > 650) { this.die(); }
        }

        die() {
            this.physics.pause();
            this.player.setTint(0xff0000); 
            this.cameras.main.shake(150, 0.01);
            this.time.delayedCall(400, () => {
                this.scene.restart();
            });
        }

        win() {
            this.physics.pause();
            this.player.setVisible(false);
            PokiSDK.gameplayStop();

            let nextLevel = this.level + 1;
            if (this.level >= highestLevel && nextLevel <= 50) {
                highestLevel = nextLevel;
                localStorage.setItem('stickman_unlocked_hc', highestLevel);
            }

            this.cameras.main.fade(500, 0, 0, 0);
            this.time.delayedCall(500, () => {
                PokiSDK.commercialBreak().then(() => {
                    if (nextLevel <= 50) {
                        this.scene.start('GameScene', { level: nextLevel });
                    } else {
                        this.scene.start('LobbyScene');
                    }
                });
            });
        }
    }

    const config = {
        type: Phaser.AUTO,
        width: 800,
        height: 600,
        physics: {
            default: 'arcade',
            arcade: { gravity: { y: 1400 }, debug: false } // Trọng lực rất cao để nhân vật rơi nhanh, dứt khoát
        },
        scene: [BootScene, LobbyScene, GameScene]
    };

    const game = new Phaser.Game(config);
</script>
</body>
</html>
