<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle Light - 40 Levels Hardcore</title>
    <style>
        body { margin: 0; padding: 0; background-color: #0f0f1a; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden;}
        canvas { box-shadow: 0 0 40px rgba(0, 255, 255, 0.2); border-radius: 12px; border: 2px solid #2980b9; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
</head>
<body>

<script>
    // --- LƯU TRỮ TIẾN TRÌNH (40 MÀN) ---
    let highestPuzzleLevel = parseInt(localStorage.getItem('puzzle_unlocked_40')) || 1;
    const MAX_LEVEL = 40;

    PokiSDK.init().then(() => { console.log("Poki SDK init"); }).catch(() => { console.log("Poki SDK failed"); });

    // --- SCENE TẠO HÌNH ẢNH ---
    class BootScene extends Phaser.Scene {
        constructor() { super({ key: 'BootScene' }); }
        create() {
            let g = this.make.graphics({ x: 0, y: 0, add: false });
            
            // Ô đèn TẮT (Thu nhỏ lại tí để vừa màn hình 40 nút)
            g.fillStyle(0x2c3e50); g.fillRoundedRect(0, 0, 48, 48, 6);
            g.lineStyle(2, 0x34495e); g.strokeRoundedRect(0, 0, 48, 48, 6);
            g.generateTexture('tile_off', 48, 48); g.clear();

            // Ô đèn SÁNG
            g.fillStyle(0xf1c40f); g.fillRoundedRect(0, 0, 48, 48, 6);
            g.lineStyle(2, 0xffeb3b); g.strokeRoundedRect(0, 0, 48, 48, 6);
            g.generateTexture('tile_on', 48, 48); g.clear();

            this.scene.start('LobbyScene');
        }
    }

    // --- SẢNH CHỜ (HIỂN THỊ 40 MÀN - CUỘN HOẶC GỌN GÀNG) ---
    class LobbyScene extends Phaser.Scene {
        constructor() { super({ key: 'LobbyScene' }); }
        create() {
            this.cameras.main.setBackgroundColor('#1a1a2e');
            
            this.add.text(400, 35, 'THẮP SÁNG TẤT CẢ (40 MÀN)', { fontSize: '32px', fill: '#f1c40f', fontStyle: 'bold' }).setOrigin(0.5);

            // Nút Reset
            this.add.text(400, 565, '[ Xóa Dữ Liệu Chơi Lại ]', { fontSize: '14px', fill: '#95a5a6' })
                .setOrigin(0.5).setInteractive({ useHandCursor: true })
                .on('pointerdown', () => {
                    localStorage.setItem('puzzle_unlocked_40', 1);
                    highestPuzzleLevel = 1;
                    this.scene.restart();
                });

            // Lưới chọn 40 màn (8 hàng x 5 cột)
            let startX = 220, startY = 90;
            for (let i = 1; i <= MAX_LEVEL; i++) {
                let row = Math.floor((i - 1) / 5);
                let col = (i - 1) % 5;
                let x = startX + col * 90;
                let y = startY + row * 58;
                
                let isLocked = i > highestPuzzleLevel; 
                let bgColor = isLocked ? 0x2d3436 : 0x0984e3;
                let textColor = isLocked ? '#636e72' : '#ffffff';

                let btn = this.add.rectangle(x, y, 75, 48, bgColor).setStrokeStyle(2, 0x000000);
                
                if (!isLocked) {
                    btn.setInteractive({ useHandCursor: true })
                       .on('pointerdown', () => this.scene.start('GameScene', { level: i }))
                       .on('pointerover', () => btn.setFillStyle(0x74b9ff))
                       .on('pointerout', () => btn.setFillStyle(0x0984e3));
                    this.add.text(x, y, `Lv.${i}`, { fontSize: '18px', fill: textColor, fontStyle: 'bold' }).setOrigin(0.5);
                } else {
                    this.add.text(x, y, `🔒 ${i}`, { fontSize: '14px', fill: textColor }).setOrigin(0.5);
                }
            }
        }
    }

    // --- CẢNH CHƠI GAME ---
    class GameScene extends Phaser.Scene {
        constructor() { super({ key: 'GameScene' }); }
        
        init(data) { 
            this.level = data.level; 
            this.isSolving = false; 
            this.timeLeft = 180; // 3 phút = 180 giây
        }

        create() {
            this.cameras.main.setBackgroundColor('#16213e');
            PokiSDK.gameplayStart();
            
            // Header UI
            this.add.text(30, 20, `MÀN: ${this.level}/${MAX_LEVEL}`, { fontSize: '20px', fill: '#00d2d3', fontStyle: 'bold' });
            
            // Đồng hồ đếm ngược 3 phút
            this.timerText = this.add.text(400, 20, 'Thời gian: 03:00', { fontSize: '20px', fill: '#ff4757', fontStyle: 'bold' }).setOrigin(0.5);

            // Bắt đầu đếm thời gian mỗi giây
            this.timeEvent = this.time.addEvent({
                delay: 1000,
                callback: this.updateTimer,
                callbackScope: this,
                loop: true
            });

            // Nút Quay về Sảnh
            this.add.text(720, 20, 'Sảnh ↩', { fontSize: '18px', fill: '#ff6b6b' })
                .setInteractive({ useHandCursor: true })
                .on('pointerdown', () => {
                    PokiSDK.gameplayStop();
                    this.scene.start('LobbyScene');
                });

            // Nút Skip (Xem quảng cáo)
            let skipBtn = this.add.rectangle(400, 555, 160, 35, 0x8e44ad, 1).setInteractive({ useHandCursor: true });
            this.add.text(400, 555, '⏭ SKIP (ADS)', { fontSize: '15px', fill: '#fff', fontStyle: 'bold' }).setOrigin(0.5);
            
            skipBtn.on('pointerover', () => skipBtn.setFillStyle(0x9b59b6));
            skipBtn.on('pointerout', () => skipBtn.setFillStyle(0x8e44ad));
            skipBtn.on('pointerdown', () => this.skipLevel());

            // --- BẢNG CẤU HÌNH 40 MÀN (Độ khó tăng dần và bùng nổ ở màn 21-40) ---
            const levelConfigs = [];
            for(let i=1; i<=40; i++) {
                let size = (i <= 10) ? (i <= 3 ? 3 : 4) : 5; // Màn đầu 3x3, 4x4, sau lên 5x5
                let shuffle = Math.min(45, 2 + Math.floor(i * 1.2)); // Mức xáo trộn tăng dần tới 45+ bước
                levelConfigs.push({ size: size, shuffle: shuffle });
            }

            let conf = levelConfigs[this.level - 1];
            this.gridSize = conf.size;
            this.shuffleMoves = conf.shuffle;

            this.createGrid();
        }

        updateTimer() {
            if (this.isSolving) return;
            this.timeLeft--;

            let minutes = Math.floor(this.timeLeft / 60);
            let seconds = this.timeLeft % 60;
            let timeString = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            this.timerText.setText(`Thời gian: ${timeString}`);

            // Hết 3 phút
            if (this.timeLeft <= 0) {
                this.timeEvent.remove();
                this.timeOut();
            }
        }

        timeOut() {
            this.isSolving = true;
            this.add.text(400, 300, 'HẾT GIỜ!', { fontSize: '56px', fill: '#ff4757', fontStyle: 'bold' })
                .setOrigin(0.5).setShadow(3, 3, '#000', 5);

            PokiSDK.gameplayStop();
            this.time.delayedCall(1000, () => {
                // Hết giờ bắt buộc xem quảng cáo rồi chơi lại màn đó
                PokiSDK.commercialBreak().then(() => {
                    this.scene.start('GameScene', { level: this.level });
                });
            });
        }

        createGrid() {
            this.gridData = []; 
            this.gridSprites = []; 

            let tileSize = 48;
            let spacing = 6;
            let boardSize = this.gridSize * tileSize + (this.gridSize - 1) * spacing;
            let startX = (800 - boardSize) / 2 + tileSize / 2;
            let startY = (600 - boardSize) / 2 + tileSize / 2 + 10;

            for (let r = 0; r < this.gridSize; r++) {
                this.gridData[r] = [];
                for (let c = 0; c < this.gridSize; c++) {
                    this.gridData[r][c] = 1; 
                }
            }

            for (let i = 0; i < this.shuffleMoves; i++) {
                let r = Phaser.Math.Between(0, this.gridSize - 1);
                let c = Phaser.Math.Between(0, this.gridSize - 1);
                this.toggleLogicOnly(r, c);
            }

            for (let r = 0; r < this.gridSize; r++) {
                this.gridSprites[r] = [];
                for (let c = 0; c < this.gridSize; c++) {
                    let x = startX + c * (tileSize + spacing);
                    let y = startY + r * (tileSize + spacing);
                    
                    let texture = this.gridData[r][c] === 1 ? 'tile_on' : 'tile_off';
                    let tile = this.add.sprite(x, y, texture).setInteractive({ useHandCursor: true });
                    
                    tile.on('pointerdown', () => this.onTileClick(r, c));
                    this.gridSprites[r][c] = tile;
                }
            }
        }

        toggleLogicOnly(r, c) {
            const toggle = (row, col) => {
                if (row >= 0 && row < this.gridSize && col >= 0 && col < this.gridSize) {
                    this.gridData[row][col] = this.gridData[row][col] === 1 ? 0 : 1;
                }
            };
            toggle(r, c); 
            toggle(r - 1, c); 
            toggle(r + 1, c); 
            toggle(r, c - 1); 
            toggle(r, c + 1); 
        }

        onTileClick(r, c) {
            if (this.isSolving) return;
            this.toggleLogicOnly(r, c);
            this.updateSprites();
            this.checkWinCondition();
        }

        updateSprites() {
            for (let r = 0; r < this.gridSize; r++) {
                for (let c = 0; c < this.gridSize; c++) {
                    let tile = this.gridSprites[r][c];
                    let texture = this.gridData[r][c] === 1 ? 'tile_on' : 'tile_off';
                    tile.setTexture(texture);
                }
            }
        }

        checkWinCondition() {
            let isWin = true;
            for (let r = 0; r < this.gridSize; r++) {
                for (let c = 0; c < this.gridSize; c++) {
                    if (this.gridData[r][c] === 0) { 
                        isWin = false;
                        break;
                    }
                }
            }

            if (isWin) {
                this.isSolving = true;
                if(this.timeEvent) this.timeEvent.remove();

                this.add.text(400, 300, 'TUYỆT VỜI!', { fontSize: '56px', fill: '#f1c40f', fontStyle: 'bold' })
                    .setOrigin(0.5).setShadow(3, 3, '#000', 5);
                
                this.time.delayedCall(800, () => this.nextLevel()); 
            }
        }

        skipLevel() {
            if (this.isSolving) return;
            this.isSolving = true;
            if(this.timeEvent) this.timeEvent.remove();
            this.nextLevel(); 
        }

        nextLevel() {
            PokiSDK.gameplayStop();

            let nextLvl = this.level + 1;
            if (this.level >= highestPuzzleLevel && nextLvl <= MAX_LEVEL) {
                highestPuzzleLevel = nextLvl;
                localStorage.setItem('puzzle_unlocked_40', highestPuzzleLevel);
            }

            PokiSDK.commercialBreak().then(() => {
                if (nextLvl <= MAX_LEVEL) {
                    this.scene.start('GameScene', { level: nextLvl });
                } else {
                    this.scene.start('LobbyScene');
                }
            });
        }
    }

    const config = {
        type: Phaser.AUTO,
        width: 800,
        height: 600,
        scene: [BootScene, LobbyScene, GameScene]
    };

    const game = new Phaser.Game(config);
</script>
</body>
</html>
