<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stickman Katana Legend - Judgment Cut Edition</title>
    <!-- Poki SDK Official Script -->
    <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #05070a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            box-shadow: 0 0 50px rgba(0, 210, 255, 0.2);
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #1a233a;
        }
        canvas {
            background: linear-gradient(to bottom, #060913, #0f172a, #070a14);
            display: block;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            font-weight: 800;
            pointer-events: none;
            z-index: 10;
        }
        .hp-bar-container {
            width: 250px;
            height: 20px;
            background: rgba(255, 0, 0, 0.2);
            border: 2px solid #ff4757;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 4px;
        }
        .hp-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff4757, #ff6b81);
            transition: width 0.15s ease;
        }
        .badge {
            background: rgba(15, 23, 42, 0.8);
            border: 1.5px solid #00d2d3;
            color: #00d2d3;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 15px;
            box-shadow: 0 0 10px rgba(0,210,211,0.3);
        }
        .stats-badge {
            color: #2ed573;
            font-size: 13px;
            margin-top: 4px;
        }
        #skillsHUD {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            pointer-events: none;
            z-index: 10;
        }
        .skill-box {
            width: 70px;
            height: 70px;
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid #00d2d3;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            font-weight: bold;
            color: #fff;
            position: relative;
            backdrop-filter: blur(5px);
            text-align: center;
        }
        .skill-key {
            position: absolute;
            top: 4px;
            left: 6px;
            background: #00d2d3;
            color: #090d16;
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 900;
        }
        .cooldown-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.82);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 15px;
            color: #ffda79;
        }
        #adOverlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.2);
            border-top: 5px solid #00d2d3;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas" width="1020" height="580"></canvas>

    <div id="ui">
        <div>
            HP KATANA HERO:
            <div class="hp-bar-container">
                <div id="playerHpBar" class="hp-bar"></div>
            </div>
            <div class="stats-badge">Sát Thương: <span id="dmgStat">40</span> | Tốc Độ: <span id="speedStat">9</span></div>
        </div>
        <div class="badge">
            MÀN: <span id="levelNum" style="color:#fff;">1</span> | ZOMBIE: <span id="zombieCount">0</span>
        </div>
    </div>

    <div id="skillsHUD">
        <div class="skill-box">
            <span class="skill-key">L-CLICK</span>
            <span>Chém Thường</span>
        </div>
        <div class="skill-box">
            <span class="skill-key">E</span>
            <span>Lướt Con Chuột</span>
            <div id="cdE" class="cooldown-overlay" style="display:none;"></div>
        </div>
        <div class="skill-box">
            <span class="skill-key">1</span>
            <span>Chém Liên Hoàn</span>
            <div id="cd1" class="cooldown-overlay" style="display:none;"></div>
        </div>
        <div class="skill-box">
            <span class="skill-key">2</span>
            <span>Vô Hình Thiên Kiếm</span>
            <div id="cd2" class="cooldown-overlay" style="display:none;"></div>
        </div>
        <div class="skill-box">
            <span class="skill-key">3</span>
            <span>Sóng Kiếm</span>
            <div id="cd3" class="cooldown-overlay" style="display:none;"></div>
        </div>
    </div>

    <div id="adOverlay">
        <div class="spinner"></div>
        <h2 style="color: #fff; font-size: 24px; margin-bottom: 10px;">ĐANG TẢI QUẢNG CÁO POKI...</h2>
        <p style="color: #aaa; font-size: 14px;">Chờ chút nhé, sức mạnh Katana của bạn đã tăng thêm!</p>
    </div>
</div>

<script>
// === POKI SDK ===
let pokiSdkReady = false;
PokiSDK.init().then(() => {
    pokiSdkReady = true;
    PokiSDK.gameLoadingFinished();
}).catch(() => {
    PokiSDK.gameLoadingFinished();
});

// === CANVAS SETUP ===
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const playerHpBar = document.getElementById('playerHpBar');
const levelNumEl = document.getElementById('levelNum');
const zombieCountEl = document.getElementById('zombieCount');
const dmgStatEl = document.getElementById('dmgStat');
const speedStatEl = document.getElementById('speedStat');
const adOverlay = document.getElementById('adOverlay');

// === GAME ENGINE VARIABLES ===
const GROUND_Y = 470;
const GRAVITY = 0.65;

let currentLevel = 1;
let gameOver = false;
let levelCleared = false;
let isPausedForAd = false;

const keys = {};
const mouse = { x: 0, y: 0 };

// === PLAYER OBJECT WITH UPGRADES ===
const player = {
    x: 150,
    y: GROUND_Y,
    vx: 0,
    vy: 0,
    baseSpeed: 9,
    speed: 9,
    maxHp: 200,
    hp: 200,
    baseDamage: 40,
    damage: 40,
    facing: 1, // 1: Phải, -1: Trái
    isGrounded: true,
    isAttacking: false,
    attackTimer: 0,
    slashAngle: 0,
    
    // Cooldowns (milliseconds)
    cooldowns: { E: 0, skill1: 0, skill2: 0, skill3: 0 },

    // Special Skill States
    isOmniSlashing: false,
    omniTimer: 0,
    
    // Skill 2: Vô Hình Thiên Kiếm (Judgment Cut)
    isJudgmentCutActive: false,
    judgmentTimer: 0,
    vortexX: 0,
    vortexY: 0,
    judgmentLines: [],

    resetPosition() {
        this.x = 150;
        this.y = GROUND_Y;
        this.vx = 0;
        this.vy = 0;
        this.hp = this.maxHp;
        this.isGrounded = true;
        this.isAttacking = false;
        this.isOmniSlashing = false;
        this.isJudgmentCutActive = false;
        this.cooldowns = { E: 0, skill1: 0, skill2: 0, skill3: 0 };
    },

    // Tăng chỉ số khi qua màn
    upgradeForNextLevel() {
        this.maxHp += 30;
        this.damage += 15;
        this.speed += 0.8;
    }
};

// === ARRAYS ===
let zombies = [];
let particles = [];
let swordWaves = [];
let slashesEffects = [];

// === ZOMBIE CLASS ===
class Zombie {
    constructor(x, hpMultiplier, attackDamage) {
        this.x = x;
        this.y = GROUND_Y;
        this.vx = 0;
        this.vy = 0;
        this.maxHp = 70 * hpMultiplier;
        this.hp = this.maxHp;
        this.damage = attackDamage;
        this.speed = 1.8 + Math.random() * 1.2;
        this.isFloating = false;
        this.floatX = 0;
        this.floatY = 0;
        this.attackCooldown = 0;
    }

    update() {
        if (this.isFloating) {
            // Hút chặt zombie vào một điểm lơ lửng trên không
            this.x += (this.floatX - this.x) * 0.25;
            this.y += (this.floatY - this.y) * 0.25;
            return;
        }

        // Trọng lực khi bị đánh văng
        if (this.y < GROUND_Y) {
            this.vy += GRAVITY;
            this.y += this.vy;
            if (this.y >= GROUND_Y) {
                this.y = GROUND_Y;
                this.vy = 0;
            }
        }

        // Bò/đuổi theo Player
        const dx = player.x - this.x;
        this.x += Math.sign(dx) * this.speed;

        // Cắn Player
        if (Math.abs(dx) < 25 && Math.abs(player.y - this.y) < 30 && this.attackCooldown <= 0) {
            player.hp -= this.damage;
            this.attackCooldown = 55;
            createSparks(player.x, player.y - 20, 10, '#ff4757');
        }

        if (this.attackCooldown > 0) this.attackCooldown--;
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        // Zombie Stickman
        ctx.strokeStyle = '#2ed573';
        ctx.lineWidth = 3.5;

        // Đầu Zombie
        ctx.beginPath();
        ctx.arc(0, -35, 9, 0, Math.PI * 2);
        ctx.stroke();

        // Mắt Đỏ Rực
        ctx.fillStyle = '#ff4757';
        ctx.beginPath();
        ctx.arc(player.x > this.x ? 3 : -3, -37, 2.5, 0, Math.PI * 2);
        ctx.fill();

        // Thân
        ctx.beginPath();
        ctx.moveTo(0, -26);
        ctx.lineTo(0, -10);
        
        // Tay cắn
        const armDir = player.x > this.x ? 1 : -1;
        ctx.moveTo(0, -20);
        ctx.lineTo(12 * armDir, -16);
        ctx.moveTo(0, -20);
        ctx.lineTo(10 * armDir, -10);

        // Chân
        ctx.moveTo(0, -10);
        ctx.lineTo(-6, 0);
        ctx.moveTo(0, -10);
        ctx.lineTo(6, 0);
        ctx.stroke();

        // Thanh Máu Zombie
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(-15, -52, 30, 4);
        ctx.fillStyle = '#ff4757';
        ctx.fillRect(-15, -52, Math.max(0, (this.hp / this.maxHp) * 30), 4);

        ctx.restore();
    }
}

// === EFFECT & PARTICLE CREATORS ===
function createSparks(x, y, count, color = '#fffa65') {
    for (let i = 0; i < count; i++) {
        particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 12,
            vy: (Math.random() - 0.5) * 12,
            life: 15 + Math.random() * 15,
            color,
            size: 1.5 + Math.random() * 2
        });
    }
}

function addSlashEffect(x, y, radius, startAngle, endAngle, color = '#00d2d3') {
    slashesEffects.push({
        x, y, radius, startAngle, endAngle, color,
        life: 10,
        maxLife: 10
    });
}

// === LEVEL SETUP ===
function setupLevel(lvl) {
    currentLevel = lvl;
    gameOver = false;
    levelCleared = false;
    zombies = [];
    particles = [];
    swordWaves = [];
    slashesEffects = [];

    const zombieCount = 7 + lvl * 5;
    const hpMultiplier = 1 + lvl * 0.35;
    const attackDamage = 8 + lvl * 2.5;

    for (let i = 0; i < zombieCount; i++) {
        const spawnX = Math.random() < 0.5 ? -60 - Math.random() * 500 : canvas.width + 60 + Math.random() * 500;
        zombies.push(new Zombie(spawnX, hpMultiplier, attackDamage));
    }

    player.resetPosition();

    if (typeof PokiSDK !== 'undefined' && PokiSDK.gameplayStart) {
        PokiSDK.gameplayStart();
    }
}

// === CONTROLS & LISTENERS ===
window.addEventListener('keydown', (e) => {
    keys[e.key.toLowerCase()] = true;

    if (gameOver || levelCleared || isPausedForAd) return;

    // Nhảy / Bay lên trời (Phím W hoặc Space)
    if ((e.key.toLowerCase() === 'w' || e.code === 'Space') && player.isGrounded) {
        player.vy = -14.5;
        player.isGrounded = false;
        createSparks(player.x, player.y, 8, '#ffffff');
    }

    const now = Date.now();

    // Skill E: LƯỚT CHÍNH XÁC ĐẾN VỊ TRÍ CON CHUỘT
    if (e.key.toLowerCase() === 'e' && now > player.cooldowns.E) {
        player.cooldowns.E = now + 1500; // 1.5s CD
        
        // Vệt bóng cũ
        createSparks(player.x, player.y - 20, 20, '#00d2d3');
        
        // Lướt đến tọa độ con chuột chỉ định
        player.x = Math.max(30, Math.min(canvas.width - 30, mouse.x));
        player.y = Math.max(50, Math.min(GROUND_Y, mouse.y));
        player.vy = 0;

        // Vệt bóng mới
        createSparks(player.x, player.y - 20, 20, '#00d2d3');
        addSlashEffect(player.x, player.y - 20, 50, 0, Math.PI * 2, '#00d2d3');
    }

    // Skill 1: Chém Liên Hoàn (Omni-Slash)
    if (e.key === '1' && now > player.cooldowns.skill1 && zombies.length > 0) {
        player.cooldowns.skill1 = now + 4500;
        player.isOmniSlashing = true;
        player.omniTimer = 24;
    }

    // Skill 2: VÔ HÌNH THIÊN KIẾM (GOM ZOMBIE + HÀNG NGÀN NHÁT CHÉM VÔ HÌNH)
    if (e.key === '2' && now > player.cooldowns.skill2 && zombies.length > 0) {
        player.cooldowns.skill2 = now + 7500;
        player.isJudgmentCutActive = true;
        player.judgmentTimer = 80; // Dài hơn để thể hiện hàng ngàn nhát chém
        player.vortexX = mouse.x;
        player.vortexY = 170; // Lơ lửng trên trời
        player.judgmentLines = [];
    }

    // Skill 3: Sóng Kiếm (Sword Wave)
    if (e.key === '3' && now > player.cooldowns.skill3) {
        player.cooldowns.skill3 = now + 3500;
        swordWaves.push({
            x: player.x,
            y: player.y - 20,
            dir: player.facing,
            speed: 18,
            radius: 45
        });
    }
});

window.addEventListener('keyup', (e) => {
    keys[e.key.toLowerCase()] = false;
});

canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
});

canvas.addEventListener('mousedown', (e) => {
    if (e.button === 0) {
        if (gameOver) {
            setupLevel(currentLevel);
            return;
        }
        if (levelCleared) {
            nextLevelWithAd();
            return;
        }

        // Chém Katana thường
        if (!player.isAttacking) {
            player.isAttacking = true;
            player.attackTimer = 10;
            performNormalSlash();
        }
    }
});

// === ATTACK LOGIC ===
function performNormalSlash() {
    const attackRange = 85;
    player.facing = mouse.x > player.x ? 1 : -1;

    addSlashEffect(
        player.x, player.y - 20, 60,
        player.facing === 1 ? -Math.PI / 3 : Math.PI * 2 / 3,
        player.facing === 1 ? Math.PI / 3 : Math.PI * 4 / 3,
        '#00d2d3'
    );

    zombies.forEach(z => {
        if (Math.abs(z.x - player.x) < attackRange && Math.abs(z.y - player.y) < 60) {
            z.hp -= player.damage;
            z.vx = player.facing * 5; // Đánh văng lùi
            createSparks(z.x, z.y - 20, 12, '#fffa65');
        }
    });
}

function nextLevelWithAd() {
    if (isPausedForAd) return;

    if (typeof PokiSDK !== 'undefined' && PokiSDK.gameplayStop) {
        PokiSDK.gameplayStop();
    }

    isPausedForAd = true;
    adOverlay.style.display = 'flex';

    const proceed = () => {
        adOverlay.style.display = 'none';
        isPausedForAd = false;
        player.upgradeForNextLevel(); // Khoẻ hơn qua mỗi màn
        setupLevel(currentLevel + 1);
    };

    if (pokiSdkReady) {
        PokiSDK.commercialBreak().then(proceed).catch(proceed);
    } else {
        setTimeout(proceed, 1200);
    }
}

// === GAME UPDATE ===
function update() {
    if (gameOver || levelCleared || isPausedForAd) return;

    // 1. DI CHUYỂN TỰ DO & TRỌNG LỰC
    if (keys['a'] || keys['arrowleft']) {
        player.x -= player.speed;
        player.facing = -1;
    }
    if (keys['d'] || keys['arrowright']) {
        player.x += player.speed;
        player.facing = 1;
    }
    player.x = Math.max(20, Math.min(canvas.width - 20, player.x));

    // Xử lý bay/nhảy
    if (!player.isGrounded) {
        player.vy += GRAVITY;
        player.y += player.vy;
        if (player.y >= GROUND_Y) {
            player.y = GROUND_Y;
            player.vy = 0;
            player.isGrounded = true;
        }
    }

    // 2. SKILL 1: OMNI-SLASH
    if (player.isOmniSlashing) {
        player.omniTimer--;
        if (zombies.length > 0 && player.omniTimer % 2 === 0) {
            const randomZombie = zombies[Math.floor(Math.random() * zombies.length)];
            player.x = randomZombie.x + (Math.random() - 0.5) * 30;
            player.y = randomZombie.y;
            randomZombie.hp -= player.damage * 0.6;
            
            addSlashEffect(randomZombie.x, randomZombie.y - 20, 45, Math.random() * Math.PI, Math.random() * Math.PI * 2, '#fffa65');
            createSparks(randomZombie.x, randomZombie.y - 20, 8, '#fffa65');
        }
        if (player.omniTimer <= 0) {
            player.isOmniSlashing = false;
            player.y = GROUND_Y;
        }
    }

    // 3. SKILL 2: VÔ HÌNH THIÊN KIẾM (JUDGMENT CUT)
    if (player.isJudgmentCutActive) {
        player.judgmentTimer--;
        
        // Player đứng yên tại chỗ trên mặt đất, tra kiếm
        player.vx = 0;

        // Gom tất cả zombie lơ lửng tại điểm vortexX, vortexY
        zombies.forEach(z => {
            z.isFloating = true;
            z.floatX = player.vortexX + (Math.random() - 0.5) * 70;
            z.floatY = player.vortexY + (Math.random() - 0.5) * 50;

            // Bị chém liên tục hàng ngàn nhát
            if (player.judgmentTimer % 2 === 0) {
                z.hp -= player.damage * 0.35;
                createSparks(z.x, z.y, 4, '#00d2d3');
            }
        });

        // Tạo ra các đường chém vô hình chằng chịt xuất hiện ngẫu nhiên xung quanh khu vực lơ lửng
        for (let i = 0; i < 4; i++) {
            const angle = Math.random() * Math.PI * 2;
            const length = 80 + Math.random() * 60;
            const cx = player.vortexX + (Math.random() - 0.5) * 100;
            const cy = player.vortexY + (Math.random() - 0.5) * 80;
            player.judgmentLines.push({
                x1: cx - Math.cos(angle) * length,
                y1: cy - Math.sin(angle) * length,
                x2: cx + Math.cos(angle) * length,
                y2: cy + Math.sin(angle) * length,
                life: 6
            });
        }

        if (player.judgmentTimer <= 0) {
            player.isJudgmentCutActive = false;
            zombies.forEach(z => {
                z.isFloating = false;
                z.vy = 5; // Rơi tự do
            });
        }
    }

    // Update Chém Thường
    if (player.isAttacking) {
        player.attackTimer--;
        if (player.attackTimer <= 0) player.isAttacking = false;
    }

    // 4. UPDATE SÓNG KIẾM
    for (let i = swordWaves.length - 1; i >= 0; i--) {
        let w = swordWaves[i];
        w.x += w.dir * w.speed;

        zombies.forEach(z => {
            if (Math.hypot(z.x - w.x, z.y - w.y) < w.radius + 15) {
                z.hp -= player.damage * 1.2;
                createSparks(z.x, z.y - 20, 10, '#00d2d3');
            }
        });

        if (w.x < -50 || w.x > canvas.width + 50) swordWaves.splice(i, 1);
    }

    // 5. UPDATE ZOMBIES
    for (let i = zombies.length - 1; i >= 0; i--) {
        let z = zombies[i];
        z.update();

        if (z.hp <= 0) {
            createSparks(z.x, z.y - 20, 25, '#2ed573');
            zombies.splice(i, 1);
        }
    }

    // 6. UPDATE PARTICLES & EFFECTS
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }

    for (let i = slashesEffects.length - 1; i >= 0; i--) {
        let s = slashesEffects[i];
        s.life--;
        if (s.life <= 0) slashesEffects.splice(i, 1);
    }

    for (let i = player.judgmentLines.length - 1; i >= 0; i--) {
        let l = player.judgmentLines[i];
        l.life--;
        if (l.life <= 0) player.judgmentLines.splice(i, 1);
    }

    // GAME STATE CHECK
    if (player.hp <= 0) {
        player.hp = 0;
        gameOver = true;
        if (typeof PokiSDK !== 'undefined' && PokiSDK.gameplayStop) PokiSDK.gameplayStop();
    } else if (zombies.length === 0) {
        levelCleared = true;
        if (typeof PokiSDK !== 'undefined' && PokiSDK.gameplayStop) PokiSDK.gameplayStop();
    }

    // UI UPDATES
    playerHpBar.style.width = `${Math.max(0, (player.hp / player.maxHp) * 100)}%`;
    levelNumEl.innerText = currentLevel;
    zombieCountEl.innerText = zombies.length;
    dmgStatEl.innerText = Math.round(player.damage);
    speedStatEl.innerText = player.speed.toFixed(1);

    updateCooldownHUD();
}

function updateCooldownHUD() {
    const now = Date.now();
    const cdMap = [
        { id: 'cdE', time: player.cooldowns.E },
        { id: 'cd1', time: player.cooldowns.skill1 },
        { id: 'cd2', time: player.cooldowns.skill2 },
        { id: 'cd3', time: player.cooldowns.skill3 }
    ];

    cdMap.forEach(item => {
        const el = document.getElementById(item.id);
        if (now < item.time) {
            el.style.display = 'flex';
            el.innerText = ((item.time - now) / 1000).toFixed(1) + 's';
        } else {
            el.style.display = 'none';
        }
    });
}

// === RENDERING ENGINE ===
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. Mặt đất & Bối cảnh
    ctx.fillStyle = '#0b0f19';
    ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);
    ctx.strokeStyle = '#00d2d3';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    ctx.lineTo(canvas.width, GROUND_Y);
    ctx.stroke();

    // 2. Vẽ Sóng Kiếm (Skill 3)
    swordWaves.forEach(w => {
        ctx.strokeStyle = '#00d2d3';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.arc(w.x, w.y, w.radius, -Math.PI / 3, Math.PI / 3, w.dir === -1);
        ctx.stroke();
    });

    // 3. Vẽ Vết Chém Vô Hình (Judgment Cut Lines - Skill 2)
    player.judgmentLines.forEach(l => {
        ctx.strokeStyle = '#00d2d3';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(l.x1, l.y1);
        ctx.lineTo(l.x2, l.y2);
        ctx.stroke();
    });

    // 4. Vẽ Zombies
    zombies.forEach(z => z.draw());

    // 5. VẼ STICKMAN KATANA HERO (CHÂN THỰC)
    ctx.save();
    ctx.translate(player.x, player.y);

    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 3.5;

    // Đầu
    ctx.beginPath();
    ctx.arc(0, -38, 9, 0, Math.PI * 2);
    ctx.stroke();

    // Thân
    ctx.beginPath();
    ctx.moveTo(0, -29);
    ctx.lineTo(0, -10);

    // Dáng Chân (Khi Nhảy / Đứng)
    if (!player.isGrounded) {
        // Tư thế co chân khi bay trên không
        ctx.moveTo(0, -10);
        ctx.lineTo(-10 * player.facing, -2);
        ctx.moveTo(0, -10);
        ctx.lineTo(8 * player.facing, 4);
    } else {
        // Đứng/Chạy
        ctx.moveTo(0, -10);
        ctx.lineTo(-8 * player.facing, 0);
        ctx.moveTo(0, -10);
        ctx.lineTo(8 * player.facing, 0);
    }
    ctx.stroke();

    // Tay & KIẾM KATANA
    ctx.beginPath();
    if (player.isJudgmentCutActive) {
        // Dáng đứng ngầu tra kiếm vào bao (Judgment Cut)
        ctx.moveTo(0, -20);
        ctx.lineTo(-10 * player.facing, -12);
        ctx.stroke();

        ctx.strokeStyle = '#fffa65';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-10 * player.facing, -12);
        ctx.lineTo(-28 * player.facing, -20);
        ctx.stroke();
    } else {
        ctx.moveTo(0, -20);
        ctx.lineTo(12 * player.facing, -20);
        ctx.stroke();

        // Lưỡi kiếm sáng rực
        ctx.strokeStyle = '#fffa65';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(12 * player.facing, -20);
        ctx.lineTo(40 * player.facing, player.isGrounded ? -38 : -10);
        ctx.stroke();
    }

    ctx.restore();

    // 6. VẼ HIỆU ỨNG VỆT CHÉM (DYNAMIC SLASH TRAILS)
    slashesEffects.forEach(s => {
        ctx.strokeStyle = s.color;
        ctx.lineWidth = 6 * (s.life / s.maxLife);
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.radius, s.startAngle, s.endAngle);
        ctx.stroke();
    });

    // 7. VẼ TIA LỬA & MÁU (SPARKS & PARTICLES)
    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    });

    // OVERLAYS THẮNG / THUA
    if (gameOver) {
        ctx.fillStyle = 'rgba(5, 7, 10, 0.88)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ff4757';
        ctx.font = '800 46px Segoe UI';
        ctx.textAlign = 'center';
        ctx.fillText('BẠN ĐÃ TỬ TRẬN!', canvas.width / 2, canvas.height / 2 - 20);
        ctx.fillStyle = '#fff';
        ctx.font = '18px Segoe UI';
        ctx.fillText('Nhấp Chuột Trái để chơi lại', canvas.width / 2, canvas.height / 2 + 30);
    } else if (levelCleared) {
        ctx.fillStyle = 'rgba(5, 7, 10, 0.88)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#00d2d3';
        ctx.font = '800 44px Segoe UI';
        ctx.textAlign = 'center';
        ctx.fillText(`HOÀN THÀNH MÀN ${currentLevel}!`, canvas.width / 2, canvas.height / 2 - 30);
        ctx.fillStyle = '#2ed573';
        ctx.font = '20px Segoe UI';
        ctx.fillText('⚡ Sức mạnh Katana, Máu và Tốc độ của bạn đã được TĂNG LÊN!', canvas.width / 2, canvas.height / 2 + 10);
        ctx.fillStyle = '#fff';
        ctx.font = '16px Segoe UI';
        ctx.fillText('Nhấp Chuột Trái để sang màn tiếp theo (Xem quảng cáo Poki)', canvas.width / 2, canvas.height / 2 + 55);
    }
}

// === MAIN LOOP ===
function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

setupLevel(currentLevel);
requestAnimationFrame(loop);
</script>
