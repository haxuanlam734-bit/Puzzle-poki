<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stickman Combo Anime Fight - Stick Nodes Style</title>
    <!-- Poki SDK Official Script -->
    <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #020204;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            box-shadow: 0 0 60px rgba(138, 43, 226, 0.4);
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #8a2be2;
        }
        canvas {
            background: #08070d;
            display: block;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            font-weight: 800;
            pointer-events: none;
            z-index: 10;
        }
        .hp-bar-container {
            width: 260px;
            height: 22px;
            background: rgba(255, 0, 0, 0.2);
            border: 2px solid #a855f7;
            border-radius: 11px;
            overflow: hidden;
            margin-top: 4px;
        }
        .hp-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #c084fc, #a855f7, #7e22ce);
            transition: width 0.15s ease;
        }
        .badge {
            background: rgba(15, 23, 42, 0.85);
            border: 1.5px solid #a855f7;
            color: #c084fc;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 15px;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.4);
        }
        .stats-badge {
            color: #e9d5ff;
            font-size: 13px;
            margin-top: 4px;
        }
        #skillsHUD {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            pointer-events: none;
            z-index: 10;
        }
        .skill-box {
            width: 72px;
            height: 72px;
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid #a855f7;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            font-weight: bold;
            color: #fff;
            position: relative;
            backdrop-filter: blur(5px);
            text-align: center;
        }
        .skill-key {
            position: absolute;
            top: 4px;
            left: 6px;
            background: #a855f7;
            color: #fff;
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 900;
        }
        .cooldown-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.82);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 15px;
            color: #c084fc;
        }
        #adOverlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.2);
            border-top: 5px solid #a855f7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas" width="1020" height="580"></canvas>

    <div id="ui">
        <div>
            HP HERO (ZEN):
            <div class="hp-bar-container">
                <div id="playerHpBar" class="hp-bar"></div>
            </div>
            <div class="stats-badge">HP Max: <span id="maxHpStat">300</span> | Attack: <span id="dmgStat">25</span> (+<span id="killBonusStat">0</span>)</div>
        </div>
        <div class="badge">
            WAVE: <span id="levelNum" style="color:#fff;">1</span> | FLYING ZOMBIES: <span id="zombieCount">0</span>
        </div>
    </div>

    <div id="skillsHUD">
        <div class="skill-box">
            <span class="skill-key">L-CLICK</span>
            <span>Combo Katana</span>
        </div>
        <div class="skill-box">
            <span class="skill-key" style="background:#38bdf8;">E</span>
            <span>Teleport / Dash</span>
        </div>
        <div class="skill-box">
            <span class="skill-key">1</span>
            <span>Anime Flash Slash</span>
            <div id="cd1" class="cooldown-overlay" style="display:none;"></div>
        </div>
        <div class="skill-box">
            <span class="skill-key">2</span>
            <span>Dimension Slash</span>
            <div id="cd2" class="cooldown-overlay" style="display:none;"></div>
        </div>
        <div class="skill-box">
            <span class="skill-key">3</span>
            <span>Energy Wave</span>
            <div id="cd3" class="cooldown-overlay" style="display:none;"></div>
        </div>
    </div>

    <div id="adOverlay">
        <div class="spinner"></div>
        <h2 style="color: #fff; font-size: 24px; margin-bottom: 10px;">ĐANG TẢI QUẢNG CÁO POKI...</h2>
        <p style="color: #aaa; font-size: 14px;">Sẵn sàng chiến đấu tiếp theo!</p>
    </div>
</div>

<script>
// === POKI SDK ===
let pokiSdkReady = false;
PokiSDK.init().then(() => {
    pokiSdkReady = true;
    PokiSDK.gameLoadingFinished();
}).catch(() => {
    PokiSDK.gameLoadingFinished();
});

// === CANVAS SETUP ===
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const playerHpBar = document.getElementById('playerHpBar');
const levelNumEl = document.getElementById('levelNum');
const zombieCountEl = document.getElementById('zombieCount');
const maxHpStatEl = document.getElementById('maxHpStat');
const dmgStatEl = document.getElementById('dmgStat');
const killBonusStatEl = document.getElementById('killBonusStat');
const adOverlay = document.getElementById('adOverlay');

// === GAME ENGINE VARIABLES ===
const GROUND_Y = 470;
const GRAVITY = 0.6;

let currentLevel = 1;
let gameOver = false;
let levelCleared = false;
let isPausedForAd = false;
let animFrameCount = 0;
let totalZombiesKilled = 0;
let screenShake = 0;
let impactFrameTimer = 0;

const keys = {};
const mouse = { x: 0, y: 0 };

// === PLAYER OBJECT (STICKMAN HERO - ZEN STYLE) ===
const player = {
    x: 150,
    y: GROUND_Y,
    vx: 0,
    vy: 0,
    speed: 9.5,
    maxHp: 300,
    hp: 300,
    baseDamage: 25,
    facing: 1,
    isGrounded: true,
    isAttacking: false,
    attackTimer: 0,
    attackCombo: 0,
    
    // Ghost Trails (Bóng mờ tốc độ Stick Nodes)
    ghosts: [],

    // Cooldowns
    cooldowns: { skill1: 0, skill2: 0, skill3: 0 },

    // States
    isOmniSlashing: false,
    omniTimer: 0,
    
    isJudgmentCutActive: false,
    judgmentTimer: 0,
    vortexX: 0,
    vortexY: 0,

    get currentDamage() {
        return this.baseDamage + Math.floor(totalZombiesKilled / 2);
    },

    resetPosition() {
        this.x = 150;
        this.y = GROUND_Y;
        this.vx = 0;
        this.vy = 0;
        this.hp = this.maxHp;
        this.isGrounded = true;
        this.isAttacking = false;
        this.isOmniSlashing = false;
        this.isJudgmentCutActive = false;
        this.ghosts = [];
        this.cooldowns = { skill1: 0, skill2: 0, skill3: 0 };
    },

    upgradeForNextLevel() {
        this.maxHp += 80;
        this.baseDamage += 3;
        this.hp = this.maxHp;
    },

    addGhost() {
        this.ghosts.push({
            x: this.x,
            y: this.y,
            facing: this.facing,
            alpha: 0.6,
            isAttacking: this.isAttacking
        });
    }
};

// === ENTITY ARRAYS ===
let zombies = [];
let energyParticles = [];
let swordWaves = [];
let impactStars = [];
let animeSlashes = [];

// === FLYING & FIGHTING ZOMBIE CLASS (ARMAGON STYLE) ===
class FlyingZombie {
    constructor(x, wave) {
        this.x = x;
        this.y = Math.random() < 0.6 ? GROUND_Y - 100 - Math.random() * 200 : GROUND_Y;
        this.vx = 0;
        this.vy = 0;
        
        this.maxHp = 110 + (wave - 1) * 100; 
        this.hp = this.maxHp;
        this.damage = 5 + wave * 0.8;
        this.speed = 2.2 + Math.random() * 1.2;
        
        this.isFlying = true;
        this.attackCooldown = 0;
        this.stunTimer = 0;
        this.animOffset = Math.random() * 100;
        this.facing = 1;
        this.isAttacking = false;
        this.attackTimer = 0;
    }

    update() {
        if (this.stunTimer > 0) {
            this.stunTimer--;
            return;
        }

        const dx = player.x - this.x;
        const dy = (player.y - 30) - this.y;
        const dist = Math.hypot(dx, dy);

        this.facing = dx > 0 ? 1 : -1;

        // Bay và áp sát Player liên tục
        if (dist > 35) {
            this.x += (dx / dist) * this.speed;
            this.y += (dy / dist) * (this.speed * 0.85);
        }

        // Zombie vung đòn combo tấn công Player y hệt video
        if (dist < 45 && this.attackCooldown <= 0) {
            this.isAttacking = true;
            this.attackTimer = 12;
            this.attackCooldown = 50;

            player.hp -= this.damage;
            screenShake = 6;
            impactFrameTimer = 2; // Impact frame
            
            // Viền năng lượng đỏ khi Zombie chém
            addAnimeSlash(player.x, player.y - 20, Math.random() * Math.PI * 2, 60, '#ff0055');
            addImpactStar(player.x, player.y - 20, '#ff0055');
        }

        if (this.isAttacking) {
            this.attackTimer--;
            if (this.attackTimer <= 0) this.isAttacking = false;
        }

        if (this.attackCooldown > 0) this.attackCooldown--;
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        const floatCycle = Math.sin((animFrameCount + this.animOffset) * 0.1) * 5;

        // Thân thể Zombie Đỏ/Đen ngầu
        ctx.strokeStyle = '#ff2a2a';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';

        // Đầu
        ctx.beginPath();
        ctx.arc(0, -38 + floatCycle, 9, 0, Math.PI * 2);
        ctx.stroke();

        // Mắt Đỏ Phát Sáng
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(this.facing * 3, -40 + floatCycle, 3, 0, Math.PI * 2);
        ctx.fill();

        // Thân
        ctx.beginPath();
        ctx.moveTo(0, -29 + floatCycle);
        ctx.lineTo(0, -10 + floatCycle);
        ctx.stroke();

        // Tay võ thuật vung chém
        ctx.beginPath();
        if (this.isAttacking) {
            ctx.moveTo(0, -22 + floatCycle);
            ctx.lineTo(22 * this.facing, -18 + floatCycle);
            ctx.strokeStyle = '#ff0055';
        } else {
            ctx.moveTo(0, -22 + floatCycle);
            ctx.lineTo(14 * this.facing, -10 + floatCycle);
            ctx.moveTo(0, -22 + floatCycle);
            ctx.lineTo(-12 * this.facing, -5 + floatCycle);
        }
        ctx.stroke();

        // Chân co gập khi bay
        ctx.strokeStyle = '#ff2a2a';
        ctx.beginPath();
        ctx.moveTo(0, -10 + floatCycle);
        ctx.lineTo(-8 * this.facing, 4 + floatCycle);
        ctx.moveTo(0, -10 + floatCycle);
        ctx.lineTo(8 * this.facing, 6 + floatCycle);
        ctx.stroke();

        // Thanh Máu
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(-18, -54 + floatCycle, 36, 5);
        ctx.fillStyle = '#ff0055';
        ctx.fillRect(-18, -54 + floatCycle, Math.max(0, (this.hp / this.maxHp) * 36), 5);

        ctx.restore();
    }
}

// === VFX PARTICLES & SLASHES ===
function createEnergyParticles(x, y, count, color = '#a855f7') {
    for (let i = 0; i < count; i++) {
        energyParticles.push({
            x: x + (Math.random() - 0.5) * 20,
            y: y + (Math.random() - 0.5) * 20,
            vx: (Math.random() - 0.5) * 12,
            vy: (Math.random() - 0.5) * 12,
            size: 2 + Math.random() * 4,
            life: 12 + Math.random() * 10,
            color
        });
    }
}

function addAnimeSlash(x, y, angle, radius = 80, color = '#a855f7') {
    animeSlashes.push({
        x, y, angle, radius, color,
        life: 8,
        maxLife: 8
    });
}

function addImpactStar(x, y, color = '#ffffff') {
    impactStars.push({ x, y, color, life: 8, maxLife: 8 });
}

// === LEVEL SETUP ===
function setupLevel(lvl) {
    currentLevel = lvl;
    gameOver = false;
    levelCleared = false;
    zombies = [];
    energyParticles = [];
    swordWaves = [];
    impactStars = [];
    animeSlashes = [];

    const zombieCount = 8 + lvl * 4;

    for (let i = 0; i < zombieCount; i++) {
        const spawnX = Math.random() < 0.5 ? -60 - Math.random() * 500 : canvas.width + 60 + Math.random() * 500;
        zombies.push(new FlyingZombie(spawnX, lvl));
    }

    player.resetPosition();

    if (typeof PokiSDK !== 'undefined' && PokiSDK.gameplayStart) {
        PokiSDK.gameplayStart();
    }
}

// === CONTROLS & LISTENERS ===
window.addEventListener('keydown', (e) => {
    keys[e.key.toLowerCase()] = true;

    if (gameOver || levelCleared || isPausedForAd) return;

    if ((e.key.toLowerCase() === 'w' || e.code === 'Space') && player.isGrounded) {
        player.vy = -14.5;
        player.isGrounded = false;
        createEnergyParticles(player.x, player.y, 8, '#c084fc');
    }

    const now = Date.now();

    // CHIÊU E: TELEPORT / DASH NO CD (TỐC BIẾN & TẠO BÓNG MỜ)
    if (e.key.toLowerCase() === 'e') {
        player.addGhost();
        createEnergyParticles(player.x, player.y - 20, 15, '#38bdf8');
        
        player.x = Math.max(30, Math.min(canvas.width - 30, mouse.x));
        player.y = Math.max(50, Math.min(GROUND_Y, mouse.y));
        player.vy = 0;

        player.addGhost();
        addAnimeSlash(player.x, player.y - 20, Math.PI / 4, 70, '#38bdf8');
        addImpactStar(player.x, player.y - 20, '#38bdf8');

        zombies.forEach(z => {
            if (Math.hypot(z.x - player.x, z.y - player.y) < 110) {
                z.stunTimer = 18;
                createEnergyParticles(z.x, z.y - 20, 6, '#38bdf8');
            }
        });
    }

    // Skill 1: Anime Flash Slash
    if (e.key === '1' && now > player.cooldowns.skill1 && zombies.length > 0) {
        player.cooldowns.skill1 = now + 4500;
        player.isOmniSlashing = true;
        player.omniTimer = 26;
    }

    // Skill 2: Dimension Slash (Vô Hình Thiên Kiếm Tím Anime)
    if (e.key === '2' && now > player.cooldowns.skill2 && zombies.length > 0) {
        player.cooldowns.skill2 = now + 8000;
        player.isJudgmentCutActive = true;
        player.judgmentTimer = 120;
        player.vortexX = mouse.x;
        player.vortexY = 180;
    }

    // Skill 3: Energy Wave (Sóng Kiếm Năng Lượng)
    if (e.key === '3' && now > player.cooldowns.skill3) {
        player.cooldowns.skill3 = now + 3500;
        swordWaves.push({
            x: player.x,
            y: player.y - 20,
            dir: player.facing,
            speed: 20,
            radius: 60
        });
    }
});

window.addEventListener('keyup', (e) => {
    keys[e.key.toLowerCase()] = false;
});

canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
});

canvas.addEventListener('mousedown', (e) => {
    if (e.button === 0) {
        if (gameOver) {
            setupLevel(currentLevel);
            return;
        }
        if (levelCleared) {
            nextLevelWithAd();
            return;
        }

        if (!player.isAttacking) {
            player.isAttacking = true;
            player.attackTimer = 8;
            player.attackCombo = (player.attackCombo + 1) % 3;
            performNormalSlash();
        }
    }
});

// === ATTACK LOGIC ===
function performNormalSlash() {
    const attackRange = 110;
    player.facing = mouse.x > player.x ? 1 : -1;
    player.addGhost();

    screenShake = 4;
    impactFrameTimer = 1;

    const angle = player.facing === 1 ? -Math.PI / 6 : Math.PI + Math.PI / 6;
    addAnimeSlash(player.x + player.facing * 30, player.y - 25, angle, 90, '#c084fc');

    zombies.forEach(z => {
        if (Math.abs(z.x - player.x) < attackRange && Math.abs(z.y - player.y) < 80) {
            z.hp -= player.currentDamage;
            z.vx = player.facing * 5;
            addImpactStar(z.x, z.y - 20, '#ffffff');
            createEnergyParticles(z.x, z.y - 20, 8, '#c084fc');
        }
    });
}

function nextLevelWithAd() {
    if (isPausedForAd) return;

    if (typeof PokiSDK !== 'undefined' && PokiSDK.gameplayStop) {
        PokiSDK.gameplayStop();
    }

    isPausedForAd = true;
    adOverlay.style.display = 'flex';

    const proceed = () => {
        adOverlay.style.display = 'none';
        isPausedForAd = false;
        player.upgradeForNextLevel();
        setupLevel(currentLevel + 1);
    };

    if (pokiSdkReady) {
        PokiSDK.commercialBreak().then(proceed).catch(proceed);
    } else {
        setTimeout(proceed, 1200);
    }
}

// === GAME UPDATE ===
function update() {
    if (gameOver || levelCleared || isPausedForAd) return;
    animFrameCount++;

    if (screenShake > 0) screenShake *= 0.85;

    // Movement
    if (keys['a'] || keys['arrowleft']) {
        player.x -= player.speed;
        player.facing = -1;
        if (animFrameCount % 3 === 0) player.addGhost();
    }
    if (keys['d'] || keys['arrowright']) {
        player.x += player.speed;
        player.facing = 1;
        if (animFrameCount % 3 === 0) player.addGhost();
    }
    player.x = Math.max(20, Math.min(canvas.width - 20, player.x));

    if (!player.isGrounded) {
        player.vy += GRAVITY;
        player.y += player.vy;
        if (player.y >= GROUND_Y) {
            player.y = GROUND_Y;
            player.vy = 0;
            player.isGrounded = true;
        }
    }

    // Update Ghost Trails
    for (let i = player.ghosts.length - 1; i >= 0; i--) {
        let g = player.ghosts[i];
        g.alpha -= 0.08;
        if (g.alpha <= 0) player.ghosts.splice(i, 1);
    }

    // Skill 1: Omni Slash
    if (player.isOmniSlashing) {
        player.omniTimer--;
        if (zombies.length > 0 && player.omniTimer % 2 === 0) {
            const randomZombie = zombies[Math.floor(Math.random() * zombies.length)];
            player.x = randomZombie.x + (Math.random() - 0.5) * 30;
            player.y = randomZombie.y;
            randomZombie.hp -= player.currentDamage * 0.5;
            
            player.addGhost();
            screenShake = 5;
            addAnimeSlash(randomZombie.x, randomZombie.y - 20, Math.random() * Math.PI * 2, 75, '#e9d5ff');
            addImpactStar(randomZombie.x, randomZombie.y - 20);
        }
        if (player.omniTimer <= 0) {
            player.isOmniSlashing = false;
            player.y = GROUND_Y;
        }
    }

    // Skill 2: Dimension Cut
    if (player.isJudgmentCutActive) {
        player.judgmentTimer--;

        zombies.forEach(z => {
            z.x += (player.vortexX - z.x) * 0.1;
            z.y += (player.vortexY - z.y) * 0.1;
            z.hp -= 0.9 + currentLevel * 0.15;
        });

        if (player.judgmentTimer % 2 === 0) {
            const cx = player.vortexX + (Math.random() - 0.5) * 120;
            const cy = player.vortexY + (Math.random() - 0.5) * 100;
            const angle = Math.random() * Math.PI * 2;
            addAnimeSlash(cx, cy, angle, 90, '#c084fc');
        }

        if (player.judgmentTimer <= 0) {
            player.isJudgmentCutActive = false;
        }
    }

    if (player.isAttacking) {
        player.attackTimer--;
        if (player.attackTimer <= 0) player.isAttacking = false;
    }

    // Skill 3: Sword Wave
    for (let i = swordWaves.length - 1; i >= 0; i--) {
        let w = swordWaves[i];
        w.x += w.dir * w.speed;

        createEnergyParticles(w.x, w.y, 2, '#a855f7');

        zombies.forEach(z => {
            if (Math.hypot(z.x - w.x, z.y - w.y) < w.radius + 20) {
                z.hp -= player.currentDamage * 1.1;
                addImpactStar(z.x, z.y - 20);
            }
        });

        if (w.x < -50 || w.x > canvas.width + 50) swordWaves.splice(i, 1);
    }

    // Zombies Update & Kill Bonus (+1 Damage / 2 Kills)
    for (let i = zombies.length - 1; i >= 0; i--) {
        let z = zombies[i];
        z.update();

        if (z.hp <= 0) {
            totalZombiesKilled++;
            screenShake = 8;
            addImpactStar(z.x, z.y - 20, '#c084fc');
            createEnergyParticles(z.x, z.y - 20, 18, '#a855f7');
            zombies.splice(i, 1);
        }
    }

    // Particles Update
    for (let i = energyParticles.length - 1; i >= 0; i--) {
        let p = energyParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) energyParticles.splice(i, 1);
    }

    for (let i = impactStars.length - 1; i >= 0; i--) {
        let s = impactStars[i];
        s.life--;
        if (s.life <= 0) impactStars.splice(i, 1);
    }

    for (let i = animeSlashes.length - 1; i >= 0; i--) {
        let fs = animeSlashes[i];
        fs.life--;
        if (fs.life <= 0) animeSlashes.splice(i, 1);
    }

    // State Checks
    if (player.hp <= 0) {
        player.hp = 0;
        gameOver = true;
        if (typeof PokiSDK !== 'undefined' && PokiSDK.gameplayStop) PokiSDK.gameplayStop();
    } else if (zombies.length === 0) {
        levelCleared = true;
        if (typeof PokiSDK !== 'undefined' && PokiSDK.gameplayStop) PokiSDK.gameplayStop();
    }

    // HUD Update
    playerHpBar.style.width = `${Math.max(0, (player.hp / player.maxHp) * 100)}%`;
    levelNumEl.innerText = currentLevel;
    zombieCountEl.innerText = zombies.length;
    maxHpStatEl.innerText = Math.round(player.maxHp);
    dmgStatEl.innerText = Math.round(player.currentDamage);
    killBonusStatEl.innerText = Math.floor(totalZombiesKilled / 2);

    updateCooldownHUD();
}

function updateCooldownHUD() {
    const now = Date.now();
    const cdMap = [
        { id: 'cd1', time: player.cooldowns.skill1 },
        { id: 'cd2', time: player.cooldowns.skill2 },
        { id: 'cd3', time: player.cooldowns.skill3 }
    ];

    cdMap.forEach(item => {
        const el = document.getElementById(item.id);
        if (now < item.time) {
            el.style.display = 'flex';
            el.innerText = ((item.time - now) / 1000).toFixed(1) + 's';
        } else {
            el.style.display = 'none';
        }
    });
}

// === DRAW ANIME SLASH ARC (VỆT CHÉM NĂNG LƯỢNG) ===
function drawAnimeSlashArc(ctx, radius, color) {
    ctx.lineWidth = 14;
    ctx.strokeStyle = '#000000';
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(0, 0, radius, -Math.PI / 3, Math.PI / 3);
    ctx.stroke();

    ctx.lineWidth = 8;
    ctx.strokeStyle = color;
    ctx.beginPath();
    ctx.arc(0, 0, radius, -Math.PI / 3, Math.PI / 3);
    ctx.stroke();

    ctx.lineWidth = 3;
    ctx.strokeStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(0, 0, radius, -Math.PI / 3, Math.PI / 3);
    ctx.stroke();
}

// === RENDERING ENGINE ===
function draw() {
    ctx.save();

    // Rung màn hình (Screen Shake)
    if (screenShake > 0.5) {
        const rx = (Math.random() - 0.5) * screenShake * 2;
        const ry = (Math.random() - 0.5) * screenShake * 2;
        ctx.translate(rx, ry);
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Impact Frame chớp sáng tương phản
    if (impactFrameTimer > 0) {
        impactFrameTimer--;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.restore();
        return;
    }

    // Mặt đất & Grid Neon
    ctx.fillStyle = '#08070d';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#0f0c1b';
    ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);
    ctx.strokeStyle = '#8a2be2';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    ctx.lineTo(canvas.width, GROUND_Y);
    ctx.stroke();

    // Sóng Kiếm Năng Lượng (Skill 3)
    swordWaves.forEach(w => {
        ctx.save();
        ctx.translate(w.x, w.y);
        ctx.rotate(w.dir === 1 ? 0 : Math.PI);
        drawAnimeSlashArc(ctx, w.radius, '#a855f7');
        ctx.restore();
    });

    // Đường Chém Anime Slashes
    animeSlashes.forEach(fs => {
        ctx.save();
        ctx.translate(fs.x, fs.y);
        ctx.rotate(fs.angle);
        drawAnimeSlashArc(ctx, fs.radius, fs.color);
        ctx.restore();
    });

    // Zombies Bay & Đánh Nhau
    zombies.forEach(z => z.draw());

    // DRAW GHOST TRAILS (BÓNG MỜ STICK NODES)
    player.ghosts.forEach(g => {
        ctx.save();
        ctx.translate(g.x, g.y);
        ctx.globalAlpha = g.alpha * 0.4;
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';

        ctx.beginPath();
        ctx.arc(0, -42, 9, 0, Math.PI * 2);
        ctx.moveTo(0, -33); ctx.lineTo(0, -12);
        ctx.moveTo(0, -12); ctx.lineTo(-10 * g.facing, 0);
        ctx.moveTo(0, -12); ctx.lineTo(10 * g.facing, 0);
        ctx.stroke();
        ctx.restore();
    });

    // DRAW COOL STICKMAN HERO (ZEN)
    ctx.save();
    ctx.translate(player.x, player.y);

    const isMoving = keys['a'] || keys['d'] || keys['arrowleft'] || keys['arrowright'];
    const runCycle = isMoving ? Math.sin(animFrameCount * 0.3) : 0;

    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 4.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // Đầu
    ctx.beginPath();
    ctx.arc(0, -42, 9, 0, Math.PI * 2);
    ctx.stroke();

    // Mắt Tím Anime
    ctx.fillStyle = '#c084fc';
    ctx.beginPath();
    ctx.arc(player.facing * 3, -43, 2.5, 0, Math.PI * 2);
    ctx.fill();

    // Thân
    ctx.beginPath();
    ctx.moveTo(0, -33);
    ctx.lineTo(0, -12);
    ctx.stroke();

    // Chân Dáng Đứng/Bay Ngầu
    ctx.beginPath();
    if (!player.isGrounded) {
        ctx.moveTo(0, -12);
        ctx.lineTo(-12 * player.facing, -2);
        ctx.lineTo(-6 * player.facing, 10);

        ctx.moveTo(0, -12);
        ctx.lineTo(10 * player.facing, -4);
        ctx.lineTo(14 * player.facing, 8);
    } else {
        ctx.moveTo(0, -12);
        ctx.lineTo(-10 * player.facing + runCycle * 8, -2);
        ctx.lineTo(-12 * player.facing + runCycle * 8, 0);

        ctx.moveTo(0, -12);
        ctx.lineTo(10 * player.facing - runCycle * 8, -2);
        ctx.lineTo(12 * player.facing - runCycle * 8, 0);
    }
    ctx.stroke();

    // Tay & Kiếm Katana Tím Năng Lượng Dài
    ctx.beginPath();
    if (player.isAttacking) {
        ctx.moveTo(0, -26);
        ctx.lineTo(18 * player.facing, -20);
        ctx.stroke();

        ctx.strokeStyle = '#c084fc';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(18 * player.facing, -20);
        ctx.lineTo(62 * player.facing, -12);
        ctx.stroke();
    } else {
        ctx.moveTo(0, -26);
        ctx.lineTo(12 * player.facing, -22);
        ctx.stroke();

        ctx.strokeStyle = '#c084fc';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(12 * player.facing, -22);
        ctx.lineTo(56 * player.facing, -48);
        ctx.stroke();
    }

    ctx.restore();

    // Hit Impact Stars
    impactStars.forEach(s => {
        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = s.color;
        ctx.lineWidth = 2;

        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
            const angle = (i * Math.PI) / 4;
            const radius = i % 2 === 0 ? 20 : 8;
            ctx.lineTo(Math.cos(angle) * radius, Math.sin(angle) * radius);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
    });

    // Particles
    energyParticles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    });

    // OVERLAYS THẮNG / THUA
    if (gameOver) {
        ctx.fillStyle = 'rgba(2, 2, 4, 0.88)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ff0055';
        ctx.font = '800 46px Segoe UI';
        ctx.textAlign = 'center';
        ctx.fillText('BẠN ĐÃ TỬ TRẬN!', canvas.width / 2, canvas.height / 2 - 20);
        ctx.fillStyle = '#fff';
        ctx.font = '18px Segoe UI';
        ctx.fillText('Nhấp Chuột Trái để chơi lại', canvas.width / 2, canvas.height / 2 + 30);
    } else if (levelCleared) {
        ctx.fillStyle = 'rgba(2, 2, 4, 0.88)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#c084fc';
        ctx.font = '800 44px Segoe UI';
        ctx.textAlign = 'center';
        ctx.fillText(`HOÀN THÀNH WAVE ${currentLevel}!`, canvas.width / 2, canvas.height / 2 - 30);
        ctx.fillStyle = '#e9d5ff';
        ctx.font = '20px Segoe UI';
        ctx.fillText(`⚡ Sát thương hiện tại: ${player.currentDamage} (+${Math.floor(totalZombiesKilled / 2)} từ diệt Zombie)`, canvas.width / 2, canvas.height / 2 + 10);
        ctx.fillStyle = '#fff';
        ctx.font = '16px Segoe UI';
        ctx.fillText('Nhấp Chuột Trái để sang Wave tiếp theo (Xem quảng cáo Poki)', canvas.width / 2, canvas.height / 2 + 55);
    }

    ctx.restore();
}

// === MAIN LOOP ===
function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

setupLevel(currentLevel);
requestAnimationFrame(loop);
</script>
