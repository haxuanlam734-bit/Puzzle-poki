<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stickman Spider Parkour - Fast Swinging Poki Edition</title>
    <!-- Poki SDK Official Script -->
    <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #0b0f19;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            box-shadow: 0 15px 50px rgba(0,0,0,0.9);
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #2a324b;
        }
        canvas {
            background: linear-gradient(to bottom, #090d16, #111b2d, #1a2942);
            display: block;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 20px;
            font-weight: 800;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.9);
            pointer-events: none;
            z-index: 10;
        }
        .badge {
            background: rgba(235, 59, 90, 0.25);
            border: 1.5px solid #eb3b5a;
            color: #ff793f;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 16px;
        }
        #instructions {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(11, 15, 25, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 14px;
            pointer-events: none;
            text-align: center;
            backdrop-filter: blur(5px);
            z-index: 10;
        }
        #adOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.94);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.2);
            border-top: 5px solid #ff3838;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas" width="960" height="540"></canvas>

    <div id="ui">
        <div>Màn: <span id="level" style="color:#2ed573;">1</span> / 10</div>
        <div class="badge">Khoảng cách tới đích: <span id="dist">500</span>m</div>
    </div>

    <div id="instructions">
        🖱️ <b>Giữ Chuột Trái</b>: Bắn tơ đu dây siêu tốc | ⌨️ <b>Space</b>: Bật đà văng người / Parkour bật tường
    </div>

    <div id="adOverlay">
        <div class="spinner"></div>
        <h2 style="color: #fff; font-size: 24px; margin-bottom: 10px;">ĐANG TẢI QUẢNG CÁO POKI...</h2>
        <p style="color: #aaa; font-size: 14px;">Màn chơi tiếp theo sẽ bắt đầu sau giây lát</p>
    </div>
</div>

<script>
// === POKI SDK INTEGRATION ===
let pokiSdkReady = false;

PokiSDK.init().then(() => {
    pokiSdkReady = true;
    PokiSDK.gameLoadingFinished();
}).catch(() => {
    PokiSDK.gameLoadingFinished();
});

// === GAME CONSTANTS & VARIABLES ===
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const levelEl = document.getElementById('level');
const distEl = document.getElementById('dist');
const adOverlay = document.getElementById('adOverlay');

const GRAVITY = 0.38;
const FRICTION = 0.99; // Giảm ma sát để đu dây nhanh hơn
const WALL_SLIDE_FRICTION = 0.85;

let currentLevel = 1;
const MAX_LEVELS = 10;
let levelGoalX = 3000;
let cameraX = 0;
let gameOver = false;
let levelCleared = false;
let isPausedForAd = false;

// === STICKMAN SPIDERMAN OBJECT ===
const player = {
    x: 100,
    y: 200,
    vx: 0,
    vy: 0,
    radius: 12,
    isGrounded: false,
    isTouchingWall: false,
    wallSide: 0,
    
    web: {
        active: false,
        targetX: 0,
        targetY: 0,
        length: 0
    },

    reset(startX = 100, startY = 200) {
        this.x = startX;
        this.y = startY;
        this.vx = 6; // Tốc độ xuất phát nhanh hơn
        this.vy = 0;
        this.web.active = false;
        this.isGrounded = false;
        this.isTouchingWall = false;
    }
};

// === LEVEL OBJECTS ===
let walls = [];       // Các tòa nhà / tường
let grappleNodes = [];// CỘT / ĐIỂM BÁM LƠ LỬNG TRÊN KHÔNG
let skeletons = [];   // KẺ ĐỊCH SKELETON ĐỨNG IM BẮN
let bullets = [];     // ĐẠN

function setupLevel(lvl) {
    levelGoalX = 2200 + lvl * 800;
    walls = [];
    grappleNodes = [];
    skeletons = [];
    bullets = [];
    cameraX = 0;
    gameOver = false;
    levelCleared = false;

    // Sàn xuất phát
    walls.push({ x: 0, y: 380, width: 300, height: 160, isFinish: false });

    let currX = 350;
    while (currX < levelGoalX - 300) {
        const gap = 140 + Math.random() * 120;
        const width = 80 + Math.random() * 80;
        const height = 150 + Math.random() * 200;
        const y = canvas.height - height;

        // Tạo tòa nhà
        walls.push({ x: currX, y, width, height, isFinish: false });

        // TẠO CỘT / ĐIỂM BÁM LƠ LỬNG TRÊN KHÔNG (Để đu dây siêu nhanh)
        grappleNodes.push({
            x: currX - gap / 2,
            y: 80 + Math.random() * 120,
            radius: 8
        });

        // TẠO SKELETON ĐỨNG IM BẮN TRÊN NÓC NHÀ
        if (Math.random() < 0.5 + (lvl * 0.03)) {
            skeletons.push({
                x: currX + width / 2,
                y: y - 25, // Đứng trên nóc
                lastShot: 0,
                cooldown: Math.max(1200, 2600 - lvl * 150)
            });
        }

        currX += width + gap;
    }

    // Tòa nhà Đích
    walls.push({ x: levelGoalX, y: 240, width: 400, height: 300, isFinish: true });

    player.reset(100, 200);

    if (typeof PokiSDK !== 'undefined' && PokiSDK.gameplayStart) {
        PokiSDK.gameplayStart();
    }
}

// === INPUT HANDLING ===
const mouse = { x: 0, y: 0 };

window.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
});

canvas.addEventListener('mousedown', (e) => {
    if (e.button === 0) {
        if (gameOver) {
            setupLevel(currentLevel);
            return;
        }
        if (levelCleared) {
            nextLevelWithAd();
            return;
        }
        attachWeb();
    }
});

window.addEventListener('mouseup', (e) => {
    if (e.button === 0) {
        player.web.active = false;
    }
});

function attachWeb() {
    if (isPausedForAd) return;
    const targetWorldX = mouse.x + cameraX;
    const targetWorldY = mouse.y;

    // Ưu tiên bám vào các điểm/cột lơ lửng nếu nhấp gần chúng
    let bestTarget = null;
    let minDist = 120; // Bán kính ưu tiên bắt điểm

    for (let node of grappleNodes) {
        let d = Math.hypot(targetWorldX - node.x, targetWorldY - node.y);
        if (d < minDist) {
            minDist = d;
            bestTarget = { x: node.x, y: node.y };
        }
    }

    if (bestTarget) {
        player.web.active = true;
        player.web.targetX = bestTarget.x;
        player.web.targetY = bestTarget.y;
    } else {
        // Bắn vào tường hoặc trần
        player.web.active = true;
        player.web.targetX = targetWorldX;
        player.web.targetY = targetWorldY;
    }

    const dx = player.x - player.web.targetX;
    const dy = player.y - player.web.targetY;
    player.web.length = Math.max(30, Math.sqrt(dx * dx + dy * dy));
}

window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
        if (isPausedForAd) return;

        if (player.web.active) {
            // Cắt tơ & BẬT ĐÀ VĂNG NGƯỜI SIÊU TỐC
            player.web.active = false;
            player.vy -= 8;
            player.vx += 8; // Lực văng mạnh về phía trước
        } else if (player.isTouchingWall) {
            // Parkour bật tường
            player.vy = -11;
            player.vx += (player.wallSide === -1) ? -8 : 8;
        } else if (player.isGrounded) {
            player.vy = -12;
        }
    }
});

// === QUẢNG CÁO POKI ===
function nextLevelWithAd() {
    if (isPausedForAd) return;
    
    if (typeof PokiSDK !== 'undefined' && PokiSDK.gameplayStop) {
        PokiSDK.gameplayStop();
    }

    isPausedForAd = true;
    adOverlay.style.display = 'flex';

    const proceedToNextLevel = () => {
        adOverlay.style.display = 'none';
        isPausedForAd = false;
        currentLevel = (currentLevel < MAX_LEVELS) ? currentLevel + 1 : 1;
        setupLevel(currentLevel);
    };

    if (pokiSdkReady) {
        PokiSDK.commercialBreak().then(() => {
            proceedToNextLevel();
        }).catch(() => {
            proceedToNextLevel();
        });
    } else {
        setTimeout(proceedToNextLevel, 1200);
    }
}

// === GAME ENGINE & PHYSICS ===
function update(now) {
    if (gameOver || levelCleared || isPausedForAd) return;

    // Trọng lực & Ma sát
    player.vy += GRAVITY;
    player.vx *= FRICTION;
    player.vy *= FRICTION;

    // ĐU DÂY SIÊU TỐC (SWINGING PHYSICS)
    if (player.web.active) {
        const dx = player.x - player.web.targetX;
        const dy = player.y - player.web.targetY;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist > player.web.length) {
            const angle = Math.atan2(dy, dx);
            player.x = player.web.targetX + Math.cos(angle) * player.web.length;
            player.y = player.web.targetY + Math.sin(angle) * player.web.length;

            // Tăng lực kéo đu dây (Swing force) cực bốc
            const swingForce = 1.35;
            player.vx -= Math.cos(angle) * swingForce;
            player.vy -= Math.sin(angle) * swingForce;
        }
    }

    player.x += player.vx;
    player.y += player.vy;

    player.isGrounded = false;
    player.isTouchingWall = false;

    // Va chạm tường & Tiếp đất
    for (let wall of walls) {
        if (player.x + player.radius > wall.x && player.x - player.radius < wall.x + wall.width) {
            if (player.y + player.radius >= wall.y && player.y - player.radius < wall.y + 25) {
                player.y = wall.y - player.radius;
                player.vy = 0;
                player.isGrounded = true;

                if (wall.isFinish) {
                    levelCleared = true;
                    if (typeof PokiSDK !== 'undefined' && PokiSDK.gameplayStop) {
                        PokiSDK.gameplayStop();
                    }
                }
            }
        }

        if (player.y + player.radius > wall.y && player.y - player.radius < wall.y + wall.height) {
            if (Math.abs((player.x + player.radius) - wall.x) < 7) {
                player.x = wall.x - player.radius;
                player.vx = 0;
                player.vy *= WALL_SLIDE_FRICTION;
                player.isTouchingWall = true;
                player.wallSide = 1;
            } else if (Math.abs((player.x - player.radius) - (wall.x + wall.width)) < 7) {
                player.x = wall.x + wall.width + player.radius;
                player.vx = 0;
                player.vy *= WALL_SLIDE_FRICTION;
                player.isTouchingWall = true;
                player.wallSide = -1;
            }
        }
    }

    // SKELETON ĐỨNG IM BẮN ĐẠN
    for (let sk of skeletons) {
        if (now - sk.lastShot > sk.cooldown && Math.abs(player.x - sk.x) < 700) {
            sk.lastShot = now;
            const angle = Math.atan2(player.y - sk.y, player.x - sk.x);
            const speed = 4.8 + currentLevel * 0.2; // Tốc độ đạn vừa phải để dễ né
            bullets.push({
                x: sk.x,
                y: sk.y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                radius: 5
            });
        }
    }

    // Xử lý đạn
    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;

        const dist = Math.hypot(player.x - b.x, player.y - b.y);
        if (dist < player.radius + b.radius) {
            gameOver = true;
            if (typeof PokiSDK !== 'undefined' && PokiSDK.gameplayStop) {
                PokiSDK.gameplayStop();
            }
        }

        if (b.x < cameraX - 100 || b.x > cameraX + canvas.width + 100) {
            bullets.splice(i, 1);
        }
    }

    cameraX = player.x - 200;

    if (player.y > canvas.height + 150) {
        gameOver = true;
        if (typeof PokiSDK !== 'undefined' && PokiSDK.gameplayStop) {
            PokiSDK.gameplayStop();
        }
    }

    levelEl.innerText = currentLevel;
    distEl.innerText = Math.max(0, Math.floor((levelGoalX - player.x) / 10));
}

// === RENDERING ENGINE ===
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(-cameraX, 0);

    // 1. Vẽ Tòa nhà
    for (let wall of walls) {
        if (wall.isFinish) {
            ctx.fillStyle = '#f7b731';
            ctx.strokeStyle = '#fa8231';
        } else {
            ctx.fillStyle = '#1e272e';
            ctx.strokeStyle = '#00d2d3';
        }
        ctx.lineWidth = 3;
        ctx.fillRect(wall.x, wall.y, wall.width, wall.height);
        ctx.strokeRect(wall.x, wall.y, wall.width, wall.height);

        if (wall.isFinish) {
            ctx.fillStyle = '#2ed573';
            ctx.fillRect(wall.x + 30, wall.y - 60, 6, 60);
            ctx.beginPath();
            ctx.moveTo(wall.x + 36, wall.y - 60);
            ctx.lineTo(wall.x + 90, wall.y - 40);
            ctx.lineTo(wall.x + 36, wall.y - 20);
            ctx.fill();
        }
    }

    // 2. VẼ CỘT / ĐIỂM BÁM LƠ LỬNG TRÊN KHÔNG
    for (let node of grappleNodes) {
        ctx.fillStyle = '#00d2d3';
        ctx.beginPath();
        ctx.arc(node.x, node.y, node.radius, 0, Math.PI * 2);
        ctx.fill();

        // Mòng tròn phát sáng bao quanh
        ctx.strokeStyle = 'rgba(0, 210, 211, 0.4)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(node.x, node.y, node.radius + 6, 0, Math.PI * 2);
        ctx.stroke();
    }

    // 3. VẼ KẺ ĐỊCH SKELETON (ĐỨNG IM BẮN)
    for (let sk of skeletons) {
        // Thân Skeleton (Màu xám trắng)
        ctx.strokeStyle = '#dcdde1';
        ctx.fillStyle = '#dcdde1';
        ctx.lineWidth = 3;

        // Đầu
        ctx.beginPath();
        ctx.arc(sk.x, sk.y - 12, 7, 0, Math.PI * 2);
        ctx.fill();

        // Mắt đỏ quỷ
        ctx.fillStyle = '#ff3838';
        ctx.beginPath();
        ctx.arc(sk.x + (player.x > sk.x ? 2 : -2), sk.y - 13, 2, 0, Math.PI * 2);
        ctx.fill();

        // Thân & Chân đứng im
        ctx.strokeStyle = '#dcdde1';
        ctx.beginPath();
        ctx.moveTo(sk.x, sk.y - 5);
        ctx.lineTo(sk.x, sk.y + 10);
        ctx.moveTo(sk.x, sk.y + 10);
        ctx.lineTo(sk.x - 6, sk.y + 22);
        ctx.moveTo(sk.x, sk.y + 10);
        ctx.lineTo(sk.x + 6, sk.y + 22);
        
        // Tay giơ cung/súng nhắm về hướng Spiderman
        const aimAngle = Math.atan2(player.y - sk.y, player.x - sk.x);
        ctx.moveTo(sk.x, sk.y - 2);
        ctx.lineTo(sk.x + Math.cos(aimAngle) * 14, sk.y + Math.sin(aimAngle) * 14);
        ctx.stroke();
    }

    // 4. Vẽ Tơ nhện
    if (player.web.active) {
        ctx.beginPath();
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(player.web.targetX, player.web.targetY);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        ctx.fillStyle = '#fffa65';
        ctx.beginPath();
        ctx.arc(player.web.targetX, player.web.targetY, 5, 0, Math.PI * 2);
        ctx.fill();
    }

    // 5. Vẽ Stickman Spider-Man
    ctx.strokeStyle = '#ff3838';
    ctx.fillStyle = '#ff3838';
    ctx.lineWidth = 3.5;

    ctx.beginPath();
    ctx.arc(player.x, player.y - 12, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(player.x + 3, player.y - 14, 2.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#ff3838';
    ctx.beginPath();
    ctx.moveTo(player.x, player.y - 4);
    ctx.lineTo(player.x, player.y + 12);
    ctx.stroke();

    // Tư thế chân tay chuyển động cực ngầu
    ctx.beginPath();
    if (player.web.active) {
        ctx.moveTo(player.x, player.y - 2);
        ctx.lineTo(player.x - 12, player.y - 14);
        ctx.moveTo(player.x, player.y - 2);
        ctx.lineTo(player.x + 12, player.y + 8);

        ctx.moveTo(player.x, player.y + 12);
        ctx.lineTo(player.x - 12, player.y + 22);
        ctx.moveTo(player.x, player.y + 12);
        ctx.lineTo(player.x + 14, player.y + 16);
    } else if (player.isTouchingWall) {
        ctx.moveTo(player.x, player.y - 2);
        ctx.lineTo(player.x + (player.wallSide * 10), player.y - 8);
        ctx.moveTo(player.x, player.y + 12);
        ctx.lineTo(player.x + (player.wallSide * 12), player.y + 20);
    } else {
        ctx.moveTo(player.x, player.y - 2);
        ctx.lineTo(player.x - 8, player.y + 6);
        ctx.moveTo(player.x, player.y - 2);
        ctx.lineTo(player.x + 8, player.y + 6);

        ctx.moveTo(player.x, player.y + 12);
        ctx.lineTo(player.x - 6, player.y + 24);
        ctx.moveTo(player.x, player.y + 12);
        ctx.lineTo(player.x + 6, player.y + 24);
    }
    ctx.stroke();

    // 6. Vẽ Đạn (Bullets)
    ctx.fillStyle = '#ff9f1a';
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1;
    for (let b of bullets) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
    }

    ctx.restore();

    // Màn hình Thông báo
    if (gameOver) {
        ctx.fillStyle = 'rgba(11, 15, 25, 0.9)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#eb3b5a';
        ctx.font = '800 42px Segoe UI';
        ctx.textAlign = 'center';
        ctx.fillText('BẠN ĐÃ BỊ HẠ!', canvas.width / 2, canvas.height / 2 - 30);

        ctx.fillStyle = '#ffffff';
        ctx.font = '18px Segoe UI';
        ctx.fillText('Thử nhắm đu vào các điểm xanh lơ lửng để bay nhanh hơn!', canvas.width / 2, canvas.height / 2 + 10);
        ctx.fillText('Nhấp Chuột Trái để thử lại', canvas.width / 2, canvas.height / 2 + 50);
    } else if (levelCleared) {
        ctx.fillStyle = 'rgba(11, 15, 25, 0.9)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#2ed573';
        ctx.font = '800 42px Segoe UI';
        ctx.textAlign = 'center';
        ctx.fillText(`VƯỢT MÀN ${currentLevel} THÀNH CÔNG!`, canvas.width / 2, canvas.height / 2 - 30);

        ctx.fillStyle = '#ffffff';
        ctx.font = '18px Segoe UI';
        ctx.fillText('Đu dây siêu đẳng!', canvas.width / 2, canvas.height / 2 + 10);
        ctx.fillText('Nhấp Chuột Trái để sang màn tiếp theo (Xem quảng cáo Poki)', canvas.width / 2, canvas.height / 2 + 50);
    }
}

// === MAIN LOOP ===
function loop(now) {
    update(now);
    draw();
    requestAnimationFrame(loop);
}

setupLevel(currentLevel);
requestAnimationFrame(loop);
</script>
</body>
</html>
