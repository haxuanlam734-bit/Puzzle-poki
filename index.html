<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Puzzle Game 50 Levels</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <style>
        body { margin: 0; background: #0f0f1a; display: flex; justify-content: center; align-items: center; height: 100vh; }
    </style>
</head>
<body>
<script>
    const config = {
        type: Phaser.AUTO, width: 800, height: 600,
        backgroundColor: '#0f0f1a',
        scene: { preload: preload, create: create }
    };
    const game = new Phaser.Game(config);

    function preload() {
        // Tạo texture đơn giản bằng code để không cần link ảnh ngoài
        let g = this.make.graphics({x:0, y:0, add:false});
        g.fillStyle(0x16213e); g.fillRoundedRect(0,0,70,70,10);
        g.generateTexture('off', 70, 70);
        g.clear();
        g.fillStyle(0xfff200); g.fillRoundedRect(0,0,70,70,10);
        g.generateTexture('on', 70, 70);
    }

    function create() {
        // Màn hình chào
        this.add.text(400, 50, 'PUZZLE - GIẢI ĐỐ', { fontSize: '40px', fill: '#ff00ff' }).setOrigin(0.5);
        
        let startX = 60, startY = 150;
        for(let i=1; i<=50; i++) {
            let x = startX + ((i-1)%10)*72;
            let y = startY + Math.floor((i-1)/10)*75;
            
            let box = this.add.sprite(x, y, 'on').setInteractive();
            this.add.text(x, y, i, {fontSize: '20px', fill: '#000'}).setOrigin(0.5);
            
            box.on('pointerdown', () => {
                alert("Bạn đã chọn màn " + i + ". Mọi thứ đã sẵn sàng!");
                // Tại đây bạn có thể gọi scene chơi game
            });
        }
        this.add.text(400, 550, 'Đã tải xong 50 màn hình!', {fill: '#fff'}).setOrigin(0.5);
    }
</script>
</body>
</html>
